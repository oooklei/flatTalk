<article class="gxy-card gxy-card--audit" data-template-id="guixiaoyang_dispatch.audit.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{audit.badge}}</p>
    <h3>{{audit.title}}</h3>
    <p>{{audit.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{audit.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
