<article class="gxy-card gxy-card--capability_intro" data-template-id="guixiaoyang_dispatch.capability_intro.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{capability_intro.badge}}</p>
    <h3>{{capability_intro.title}}</h3>
    <p>{{capability_intro.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{capability_intro.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
