<article class="gxy-card gxy-card--clarify" data-template-id="guixiaoyang_dispatch.clarify.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{clarify.badge}}</p>
    <h3>{{clarify.title}}</h3>
    <p>{{clarify.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{clarify.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
