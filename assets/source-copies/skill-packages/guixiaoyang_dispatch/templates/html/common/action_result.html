<article class="gxy-card gxy-card--action-result" data-template-id="common.action_result.v1">
  <header class="gxy-card__header">
    <h3>{{title || "动作执行结果"}}</h3>
    <span class="gxy-card__tag">{{status || "已处理"}}</span>
  </header>
  <section class="gxy-card__body">
    <p>{{message || result_text || "动作已进入处理流程。"}}</p>
    <p class="gxy-card__hint">{{action_key || ""}}</p>
  </section>
</article>
