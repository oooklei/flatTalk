<article class="gxy-card gxy-card--answer" data-template-id="common.answer.v1">
  <header class="gxy-card__header">
    <h3>{{title || "桂小养答复"}}</h3>
    <span class="gxy-card__tag">{{skill_name || "通用回答"}}</span>
  </header>
  <section class="gxy-card__body">
    <p>{{answer || answer_text || content || "已收到您的问题，我会结合当前上下文继续处理。"}}</p>
  </section>
  <footer class="gxy-card__footer">
    <div class="gxy-followups">{{related_questions || suggestions || ""}}</div>
  </footer>
</article>
