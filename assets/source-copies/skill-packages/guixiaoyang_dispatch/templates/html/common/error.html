<article class="gxy-card gxy-card--error" data-template-id="common.error.v1">
  <header class="gxy-card__header">
    <h3>{{title || "处理遇到问题"}}</h3>
    <span class="gxy-card__tag">异常提示</span>
  </header>
  <section class="gxy-card__body">
    <p>{{message || error || "当前服务暂时不可用，请稍后重试或转人工处理。"}}</p>
    <p class="gxy-card__hint">{{trace_id || request_id || ""}}</p>
  </section>
</article>
