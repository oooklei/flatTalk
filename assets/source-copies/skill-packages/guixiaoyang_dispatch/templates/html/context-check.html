<article class="gxy-dispatch-card gxy-dispatch-card--context" data-template-id="guixiaoyang_dispatch.context_check.v1">
  <header class="gxy-dispatch-header">
    <p class="gxy-dispatch-kicker">{{context.badge}}</p>
    <h3>{{context.title}}</h3>
    <p>{{context.summary}}</p>
  </header>
  <section class="gxy-dispatch-context-list">
    {{context.items}}
  </section>
  <footer class="gxy-dispatch-actions">{{actions}}</footer>
</article>
