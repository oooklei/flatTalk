<article class="gxy-card gxy-card--elder_summary" data-template-id="guixiaoyang_dispatch.elder_summary.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{elder_summary.badge}}</p>
    <h3>{{elder_summary.title}}</h3>
    <p>{{elder_summary.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{elder_summary.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
