<article class="gxy-card gxy-card--fallback_status" data-template-id="guixiaoyang_dispatch.fallback_status.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{fallback_status.badge}}</p>
    <h3>{{fallback_status.title}}</h3>
    <p>{{fallback_status.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{fallback_status.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
<!-- 桂小养兜底状态卡片: 展示系统异常、技能不可用和下一步建议。 -->
