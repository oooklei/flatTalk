<article class="gxy-card gxy-card--family_summary" data-template-id="guixiaoyang_dispatch.family_summary.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{family_summary.badge}}</p>
    <h3>{{family_summary.title}}</h3>
    <p>{{family_summary.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{family_summary.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
