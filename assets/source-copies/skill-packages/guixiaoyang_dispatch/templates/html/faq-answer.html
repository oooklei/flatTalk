<article class="gxy-card gxy-card--faq_answer" data-template-id="guixiaoyang_dispatch.faq_answer.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{faq_answer.badge}}</p>
    <h3>{{faq_answer.title}}</h3>
    <p>{{faq_answer.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{faq_answer.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
