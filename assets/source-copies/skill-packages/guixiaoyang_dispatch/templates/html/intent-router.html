<article class="gxy-card gxy-card--intent_router" data-template-id="guixiaoyang_dispatch.intent_router.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{intent_router.badge}}</p>
    <h3>{{intent_router.title}}</h3>
    <p>{{intent_router.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{intent_router.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
