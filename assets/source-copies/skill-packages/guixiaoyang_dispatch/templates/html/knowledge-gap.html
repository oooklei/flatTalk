<article class="gxy-card gxy-card--knowledge_gap" data-template-id="guixiaoyang_dispatch.knowledge_gap.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{knowledge_gap.badge}}</p>
    <h3>{{knowledge_gap.title}}</h3>
    <p>{{knowledge_gap.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{knowledge_gap.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
<!-- 知识缺口卡片: 展示未命中知识库和建议补充材料。 -->
