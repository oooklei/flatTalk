<article class="gxy-card gxy-card--manual_review" data-template-id="guixiaoyang_dispatch.manual_review.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{manual_review.badge}}</p>
    <h3>{{manual_review.title}}</h3>
    <p>{{manual_review.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{manual_review.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
<!-- 人工复核卡片: 汇总需要人工处理的风险原因和角色。 -->
