<article class="gxy-card gxy-card--event-context" data-template-id="message.event_context.v1">
  <header class="gxy-card__header">
    <h3>{{title || "消息上下文"}}</h3>
    <span class="gxy-card__tag">{{event_type || "会话事件"}}</span>
  </header>
  <section class="gxy-card__body">
    <p>{{summary || context_summary || "已整理本轮对话上下文。"}}</p>
    <p class="gxy-card__hint">{{conversation_id || ""}}</p>
  </section>
</article>
