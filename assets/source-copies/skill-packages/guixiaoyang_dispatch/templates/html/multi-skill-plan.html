<article class="gxy-card gxy-card--multi_skill_plan" data-template-id="guixiaoyang_dispatch.multi_skill_plan.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{multi_skill_plan.badge}}</p>
    <h3>{{multi_skill_plan.title}}</h3>
    <p>{{multi_skill_plan.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{multi_skill_plan.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
