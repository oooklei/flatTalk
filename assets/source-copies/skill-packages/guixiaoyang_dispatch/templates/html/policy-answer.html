<article class="gxy-dispatch-card gxy-dispatch-card--policy" data-template-id="guixiaoyang_dispatch.policy_answer.v1">
  <header class="gxy-dispatch-header">
    <p class="gxy-dispatch-kicker">{{policy.badge}}</p>
    <h3>{{policy.title}}</h3>
    <p>{{policy.answer}}</p>
  </header>
  <section class="gxy-dispatch-source-list">
    {{policy.sources}}
  </section>
  <footer class="gxy-dispatch-actions">{{actions}}</footer>
</article>
