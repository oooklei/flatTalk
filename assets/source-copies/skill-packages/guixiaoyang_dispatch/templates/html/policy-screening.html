<article class="gxy-card gxy-card--policy_screening" data-template-id="guixiaoyang_dispatch.policy_screening.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{policy_screening.badge}}</p>
    <h3>{{policy_screening.title}}</h3>
    <p>{{policy_screening.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{policy_screening.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
