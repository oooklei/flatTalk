<article class="gxy-card gxy-card--profile_missing" data-template-id="guixiaoyang_dispatch.profile_missing.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{profile_missing.badge}}</p>
    <h3>{{profile_missing.title}}</h3>
    <p>{{profile_missing.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{profile_missing.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
