<article class="gxy-card gxy-card--router" data-template-id="guixiaoyang_dispatch.router.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{router.badge}}</p>
    <h3>{{router.title}}</h3>
    <p>{{router.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{router.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
<!-- 桂小养技能路由卡片: 展示识别到的意图、目标技能和可执行入口。 -->
