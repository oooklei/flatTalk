<article class="gxy-card gxy-card--safety_check" data-template-id="guixiaoyang_dispatch.safety_check.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{safety_check.badge}}</p>
    <h3>{{safety_check.title}}</h3>
    <p>{{safety_check.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{safety_check.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
<!-- 安全风险核对卡片: 核对紧急、隐私、医疗和财务风险。 -->
