<article class="gxy-card gxy-card--session_resume" data-template-id="guixiaoyang_dispatch.session_resume.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{session_resume.badge}}</p>
    <h3>{{session_resume.title}}</h3>
    <p>{{session_resume.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{session_resume.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
