<article class="gxy-dispatch-card gxy-dispatch-card--hub" data-template-id="guixiaoyang_dispatch.skill_hub.v1">
  <header class="gxy-dispatch-header">
    <p class="gxy-dispatch-kicker">{{hub.badge}}</p>
    <h3>{{hub.title}}</h3>
    <p>{{hub.summary}}</p>
  </header>
  <section class="gxy-dispatch-skill-list">
    {{hub.skills}}
  </section>
  <footer class="gxy-dispatch-actions">{{actions}}</footer>
</article>
