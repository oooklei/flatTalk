<article class="gxy-card gxy-card--voice_ready" data-template-id="guixiaoyang_dispatch.voice_ready.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{voice_ready.badge}}</p>
    <h3>{{voice_ready.title}}</h3>
    <p>{{voice_ready.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{voice_ready.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
