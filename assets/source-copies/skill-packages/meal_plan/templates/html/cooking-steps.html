<article class="gxy-card gxy-card--cooking_steps" data-template-id="meal_plan.cooking_steps.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{cooking_steps.badge}}</p>
    <h3>{{cooking_steps.title}}</h3>
    <p>{{cooking_steps.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{cooking_steps.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
