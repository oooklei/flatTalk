<article class="gxy-card gxy-card--dashboard" data-template-id="meal_plan.dashboard.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{dashboard.badge}}</p>
    <h3>{{dashboard.title}}</h3>
    <p>{{dashboard.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{dashboard.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
<!-- 膳食仪表盘模板: 展示营养结构、达标情况和风险提示。 -->
