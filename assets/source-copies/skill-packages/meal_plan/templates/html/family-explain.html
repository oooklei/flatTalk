<article class="gxy-card gxy-card--family_explain" data-template-id="meal_plan.family_explain.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{family_explain.badge}}</p>
    <h3>{{family_explain.title}}</h3>
    <p>{{family_explain.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{family_explain.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
