<article class="gxy-card gxy-card--feedback_collect" data-template-id="meal_plan.feedback_collect.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{feedback_collect.badge}}</p>
    <h3>{{feedback_collect.title}}</h3>
    <p>{{feedback_collect.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{feedback_collect.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
<!-- 膳食反馈收集卡片: 收集饭后感受、饱腹感、血糖血压反应和偏好变化。 -->
