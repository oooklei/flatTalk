<article class="gxy-card gxy-card--festival_plan" data-template-id="meal_plan.festival_plan.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{festival_plan.badge}}</p>
    <h3>{{festival_plan.title}}</h3>
    <p>{{festival_plan.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{festival_plan.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
