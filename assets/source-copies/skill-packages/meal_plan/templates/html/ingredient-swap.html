<article class="gxy-card gxy-card--ingredient_swap" data-template-id="meal_plan.ingredient_swap.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{ingredient_swap.badge}}</p>
    <h3>{{ingredient_swap.title}}</h3>
    <p>{{ingredient_swap.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{ingredient_swap.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
