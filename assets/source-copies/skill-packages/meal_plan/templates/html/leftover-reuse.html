<article class="gxy-card gxy-card--leftover_reuse" data-template-id="meal_plan.leftover_reuse.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{leftover_reuse.badge}}</p>
    <h3>{{leftover_reuse.title}}</h3>
    <p>{{leftover_reuse.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{leftover_reuse.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
