<article class="gxy-card gxy-card--nutrition_compare" data-template-id="meal_plan.nutrition_compare.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{nutrition_compare.badge}}</p>
    <h3>{{nutrition_compare.title}}</h3>
    <p>{{nutrition_compare.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{nutrition_compare.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
