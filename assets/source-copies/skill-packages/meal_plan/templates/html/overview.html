<article class="gxy-card gxy-card--overview" data-template-id="meal_plan.overview.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{overview.badge}}</p>
    <h3>{{overview.title}}</h3>
    <p>{{overview.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{overview.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
<!-- 膳食概览模板: 展示膳食推荐摘要、关键指标和主建议。 -->
