<section class="profile-section" data-slot="summary-card">
  <div class="date-badge">{{summary.badge}}</div>
  <div class="info-row">
    <span class="info-icon">{{summary.audience_icon}}</span>
    <span class="info-label">适用</span>
    <span class="info-value">{{summary.audience}}</span>
  </div>
  <div class="info-row">
    <span class="info-icon">{{summary.energy_icon}}</span>
    <span class="info-label">合计</span>
    <span class="info-value highlight">{{summary.total_kcal_label}}</span>
  </div>
  <div class="info-row">
    <span class="info-icon">{{summary.salt_icon}}</span>
    <span class="info-label">用盐</span>
    <span class="info-value sub">{{summary.salt_limit_label}}</span>
  </div>
</section>
