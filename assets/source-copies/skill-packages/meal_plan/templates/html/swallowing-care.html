<article class="gxy-card gxy-card--swallowing_care" data-template-id="meal_plan.swallowing_care.v1">
  <header class="gxy-card__header">
    <p class="gxy-card__kicker">{{swallowing_care.badge}}</p>
    <h3>{{swallowing_care.title}}</h3>
    <p>{{swallowing_care.summary}}</p>
  </header>
  <section class="gxy-card__body">
    {{swallowing_care.items}}
  </section>
  <section class="gxy-card__followups">
    {{followup_suggestions}}
  </section>
  <footer class="gxy-card__actions">
    {{actions}}
  </footer>
</article>
