  <text x="18" y="36" fill="#fff" font-size="92" font-weight="bold">巴马5天4晚康养旅居</text>
  <text x="18" y="51" fill="rgba(255,255,255,0.75)" font-size="46">康养旅居 · 精品路线</text>
  <rect x="10" y="68" width="600" height="460" rx="12" fill="#F8F8F0" stroke="#DDD" stroke-width="0.5"/>
  <g class="mountains" opacity="0.55">
  <path d="M18,138 Q38,86 58,138 Q80,80 102,138 Q125,90 148,138" fill="url(#hillGrad)" stroke="#4CAF50" stroke-width="0.5"/>
