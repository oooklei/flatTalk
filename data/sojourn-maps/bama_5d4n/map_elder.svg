  <g class="route-paths" filter="url(#shadow)">
  <path d="M 513 423 L 242 376 L 378 454 L 310 423 L 175 329 L 107 142" fill="none" stroke="#FF7826" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>
  <g class="markers">
  <g class="route-marker" style="cursor:pointer" data-type="arrival" data-day="Day1" data-name="巴马县城" data-plan="抵达巴马，入住康养基地" data-lat="24.12" data-lng="107.25" data-spot-desc="巴马瑶族自治县县城，世界长寿之乡核心区。海拔600-800米，地磁强度适中，空气负氧离子高达2-7万个/cm³，盘阳河穿城而过，是康养旅居的集散中心。县城配套完善，有长寿博物馆、民族文化广场，可品鉴巴马火麻汤、苞谷粥等长寿饮食。" transform="translate(513,423)"><circle class="hit-area" r="32" fill="transparent" pointer-events="all"/><circle r="18" fill="#4CAF50" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">起</text><text y="60" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">巴马县城</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day2" data-name="百魔洞" data-plan="天下第一洞·负氧离子磁疗" data-lat="24.15" data-lng="107.05" data-spot-desc="百魔洞是巴马最著名的溶洞景点，洞内钟乳石千姿百态，石笋林立，洞厅宏伟壮观。洞内富含负氧离子和地磁，被誉为天然氧吧和磁场养生圣地，是康养旅居的理想之地。游客可在洞内漫步感受自然的神奇魅力，体验独特的地磁养生效果。" data-spot-img="https://dimg04.c-ctrip.com/images/1mf2h12000be4fpbd5CEC_W_640_0_Q90.jpg?proc=autoorient,https://dynamic-media-cdn.tripadvisor.com/media/photo-o/07/0e/ac/36/baimo-cave.jpg?w=1200&amp;h=-1&amp;s=1,https://img.yijuhome.com.cn/20250928/1988751759041223.jpg" transform="translate(242,376)"><circle class="hit-area" r="29" fill="transparent" pointer-events="all"/><circle r="15" fill="#FF7826" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">景</text><text y="57" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">百魔洞</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="wellness" data-day="Day3" data-name="长寿村" data-plan="探访百岁老人·养生文化" data-lat="24.1" data-lng="107.15" data-spot-desc="长寿村即巴盘屯，是世界著名的长寿之乡。村内百岁老人众多，被誉为世界长寿之乡的典型代表。这里空气清新，水质优良，地磁强度适中，是养生康居的理想之地。游客可探访百岁老人，了解长寿秘诀，体验原生态的乡村生活。" data-spot-img="https://www.gxlvyouwang.com/uploads/allimg/20250806/1-250P6000045507.jpg,https://static.gxrb.com.cn/image/uploadpic/20250713/34f321dd4e3266715d994b7fd5171f36.png,https://lookaside.fbsbx.com/lookaside/crawler/media/?media_id=100064322606780" transform="translate(378,454)"><circle class="hit-area" r="29" fill="transparent" pointer-events="all"/><circle r="15" fill="#8E24AA" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">养</text><text y="57" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">长寿村</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day3" data-name="命河" data-plan="命字河道奇观" data-lat="24.12" data-lng="107.1" data-spot-desc="命河是巴马母亲河盘阳河的一段，因河道蜿蜒曲折，形似命字而得名。河水清澈见底，两岸青山翠绿，风光旖旎。命河沿岸负氧离子含量极高，是天然的养生走廊。游客可泛舟河上，欣赏两岸田园风光，感受巴马独特的山水意境。" data-spot-img="https://imgs.tom.com/travel/202203/1552028316/CONTENTe016426849834b0b.jpg,https://imgs.tom.com/travel/202203/1552028316/CONTENT60095e8e2735df43.jpg" transform="translate(310,423)"><circle class="hit-area" r="29" fill="transparent" pointer-events="all"/><circle r="15" fill="#FF7826" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">景</text><text y="57" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">命河</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day4" data-name="百鸟岩" data-plan="乘船穿越三天三夜" data-lat="24.18" data-lng="107" data-spot-desc="百鸟岩又名百魔洞支洞，是巴马第二大溶洞景观。洞内钟乳石洁白晶莹，形态各异，似鸟似兽，惟妙惟肖。洞内空气清新，负氧离子含量极高，是天然的养生宝地。游客可乘船游览地下河，欣赏洞内奇特的地质景观，感受大自然的鬼斧神工。" data-spot-img="https://dimg04.c-ctrip.com/images/1mf6o12000be4fnjz1ADB_W_640_0_Q90.jpg?proc=autoorient,https://dimg04.c-ctrip.com/images/1mf3l12000be4fsjmF302_W_640_0_Q90.jpg?proc=autoorient" transform="translate(175,329)"><circle class="hit-area" r="29" fill="transparent" pointer-events="all"/><circle r="15" fill="#FF7826" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">景</text><text y="57" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">百鸟岩</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day4" data-name="水晶宫" data-plan="溶洞天花板·鹅管群" data-lat="24.3" data-lng="106.95" data-spot-desc="水晶宫是巴马最具代表性的溶洞之一，以其晶莹剔透的钟乳石闻名。洞内石笋、石幔、石花遍布，宛如水晶宫殿。洞内恒温恒湿，空气清新，富含多种对人体有益的微量元素。是观光、养生、度假的绝佳去处，被誉为地下艺术宫殿。" data-spot-img="https://www.365135.com/upimg/userup/2509/0210525224Q.jpg,https://v2.cri.cn/784fb719-0133-48b0-af0e-b6868483901e/image/d8b34262a5b447e28472835711a4f834.1268x793.jpg" transform="translate(107,142)"><circle class="hit-area" r="29" fill="transparent" pointer-events="all"/><circle r="15" fill="#FF7826" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">景</text><text y="57" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">水晶宫</text></g>
  </g>
  <g class="legend" transform="translate(10, 535)">
