  <circle cx="360" cy="14" r="6" fill="#1976D2"/><text x="372" y="18" font-size="46" fill="#333">返程</text>
  </g>
  <g class="wellness-info" transform="translate(10, 570)">
  <rect width="600" height="70" rx="10" fill="#FFF8E1" stroke="#FFE0B2" stroke-width="0.8"/>
  <text x="15" y="22" fill="#E65100" font-size="55" font-weight="bold">康养特色</text>
  <text x="15" y="42" fill="#555" font-size="46">巴马瑶族自治县县城，世界长寿之乡核心区。海拔600-800米，地磁强度适中，空气负氧</text>
  <text x="15" y="60" fill="#555" font-size="46">离子高达2-7万个/cm³，盘阳河穿城而过，是康养旅居的集散中心。县城配套完善，有长</text>
  </g>
  <g class="spot-list" transform="translate(10, 650)">
  <rect width="600" height="190" rx="10" fill="#FAFAFA" stroke="#EEE" stroke-width="0.5"/>
  <text x="15" y="20" fill="#333" font-size="50" font-weight="bold">行程景点</text>
  <g class="spot-item" data-name="百魔洞" data-day="Day2" data-spot-desc="百魔洞是巴马最著名的溶洞景点，洞内钟乳石千姿百态，石笋林立，洞厅宏伟壮观。洞内富含负氧离子和地磁，被誉为天然氧吧和磁场养生圣地，是康养旅居的理想之地。游客可在洞内漫步感受自然的神奇魅力，体验独特的地磁养生效果。" data-spot-img="https://dimg04.c-ctrip.com/images/1mf2h12000be4fpbd5CEC_W_640_0_Q90.jpg?proc=autoorient,https://dynamic-media-cdn.tripadvisor.com/media/photo-o/07/0e/ac/36/baimo-cave.jpg?w=1200&amp;h=-1&amp;s=1,https://img.yijuhome.com.cn/20250928/1988751759041223.jpg"><circle cx="18" cy="39" r="3" fill="#FF7826"/><text x="28" y="42" fill="#333" font-size="46">百魔洞 · Day2 · 天下第一洞·负氧离子磁疗</text></g>
  <g class="spot-item" data-name="长寿村" data-day="Day3" data-spot-desc="长寿村即巴盘屯，是世界著名的长寿之乡。村内百岁老人众多，被誉为世界长寿之乡的典型代表。这里空气清新，水质优良，地磁强度适中，是养生康居的理想之地。游客可探访百岁老人，了解长寿秘诀，体验原生态的乡村生活。" data-spot-img="https://www.gxlvyouwang.com/uploads/allimg/20250806/1-250P6000045507.jpg,https://static.gxrb.com.cn/image/uploadpic/20250713/34f321dd4e3266715d994b7fd5171f36.png,https://lookaside.fbsbx.com/lookaside/crawler/media/?media_id=100064322606780"><circle cx="18" cy="57" r="3" fill="#FF7826"/><text x="28" y="60" fill="#333" font-size="46">长寿村 · Day3 · 探访百岁老人·养生文化</text></g>
  <g class="spot-item" data-name="命河" data-day="Day3" data-spot-desc="命河是巴马母亲河盘阳河的一段，因河道蜿蜒曲折，形似命字而得名。河水清澈见底，两岸青山翠绿，风光旖旎。命河沿岸负氧离子含量极高，是天然的养生走廊。游客可泛舟河上，欣赏两岸田园风光，感受巴马独特的山水意境。" data-spot-img="https://imgs.tom.com/travel/202203/1552028316/CONTENTe016426849834b0b.jpg,https://imgs.tom.com/travel/202203/1552028316/CONTENT60095e8e2735df43.jpg"><circle cx="18" cy="75" r="3" fill="#FF7826"/><text x="28" y="78" fill="#333" font-size="46">命河 · Day3 · 命字河道奇观</text></g>
  <g class="spot-item" data-name="百鸟岩" data-day="Day4" data-spot-desc="百鸟岩又名百魔洞支洞，是巴马第二大溶洞景观。洞内钟乳石洁白晶莹，形态各异，似鸟似兽，惟妙惟肖。洞内空气清新，负氧离子含量极高，是天然的养生宝地。游客可乘船游览地下河，欣赏洞内奇特的地质景观，感受大自然的鬼斧神工。" data-spot-img="https://dimg04.c-ctrip.com/images/1mf6o12000be4fnjz1ADB_W_640_0_Q90.jpg?proc=autoorient,https://dimg04.c-ctrip.com/images/1mf3l12000be4fsjmF302_W_640_0_Q90.jpg?proc=autoorient"><circle cx="18" cy="93" r="3" fill="#FF7826"/><text x="28" y="96" fill="#333" font-size="46">百鸟岩 · Day4 · 乘船穿越三天三夜</text></g>
  <g class="spot-item" data-name="水晶宫" data-day="Day4" data-spot-desc="水晶宫是巴马最具代表性的溶洞之一，以其晶莹剔透的钟乳石闻名。洞内石笋、石幔、石花遍布，宛如水晶宫殿。洞内恒温恒湿，空气清新，富含多种对人体有益的微量元素。是观光、养生、度假的绝佳去处，被誉为地下艺术宫殿。" data-spot-img="https://www.365135.com/upimg/userup/2509/0210525224Q.jpg,https://v2.cri.cn/784fb719-0133-48b0-af0e-b6868483901e/image/d8b34262a5b447e28472835711a4f834.1268x793.jpg"><circle cx="18" cy="111" r="3" fill="#FF7826"/><text x="28" y="114" fill="#333" font-size="46">水晶宫 · Day4 · 溶洞天花板·鹅管群</text></g>
  </g>
