<svg viewBox="0 0 620 850" xmlns="http://www.w3.org/2000/svg" data-route-id="bama_5d4n" data-version="elder" data-route-name="巴马5天4晚康养旅居" data-center-lat="24.2000" data-center-lng="107.1000" style="width:100%;max-width:620px;background:linear-gradient(180deg,#F5F0E8 0%,#E8F4E8 100%);border-radius:16px;font-family:'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
  <linearGradient id="boundaryGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E8F5E9" stop-opacity="0.95"/><stop offset="100%" stop-color="#C8E6C9" stop-opacity="0.8"/></linearGradient>
  <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#64B5F6" stop-opacity="0.7"/><stop offset="100%" stop-color="#1976D2" stop-opacity="0.5"/></linearGradient>
