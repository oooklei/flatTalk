  <g class="spot-item" data-name="北海银滩" data-day="Day2" data-spot-desc="南宁市 · 1. 8:30早餐后，晨练八段锦；2. 上午开展慢病管理健康讲座与一对一养老咨询；3. 午餐后午休1.5小时；4. 下午游览三街两巷历史文化街区，体验非遗手作，放松身心；5. 晚上体验瑶药足浴养生，自由休息" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E5%8C%97%E6%B5%B7%E9%93%B6%E6%BB%A9%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E5%8C%97%E6%B5%B7%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E"><circle cx="18" cy="39" r="3" fill="#FF7826"/><text class="svg-text" data-role="list_item" x="28" y="42" fill="#333" font-size="10">北海银滩 · Day2 · 北海银滩</text></g>
  <g class="spot-item" data-name="涠洲岛" data-day="Day3" data-spot-desc="南宁市→钦州市 · 1. 8:30早餐后出发，乘车前往钦州市（车程约1.5小时）；2. 抵达后入住康桥白鹭湾，午餐后午休1.5小时；3. 下午游览三娘湾景区，乘船观中华白海豚，体验渔家文化；4. 开展红树林养老漫步，呼吸高负氧离子空气；5." data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E6%B6%A0%E6%B4%B2%E5%B2%9B%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E5%8C%97%E6%B5%B7%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E"><circle cx="18" cy="57" r="3" fill="#FF7826"/><text class="svg-text" data-role="list_item" x="28" y="60" fill="#333" font-size="10">涠洲岛 · Day3 · 涠洲岛</text></g>
  <g class="spot-item" data-name="钦州三娘湾" data-day="Day4" data-spot-desc="钦州市 · 1. 8:30早餐后，晨练太极；2. 上午游览钦州老街，体验坭兴陶非遗手作，在慢创作中放松身心；3. 午餐后午休1.5小时；4. 下午开展滨海养老漫游，沿钦州湾观光，体验养身茶品鉴；5. 晚上开展健养老生讲座，体验足部理疗，自由" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E9%92%A6%E5%B7%9E%E4%B8%89%E5%A8%98%E6%B9%BE%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E9%92%A6%E5%B7%9E%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E"><circle cx="18" cy="75" r="3" fill="#FF7826"/><text class="svg-text" data-role="list_item" x="28" y="78" fill="#333" font-size="10">钦州三娘湾 · Day4 · 钦州三娘湾</text></g>
