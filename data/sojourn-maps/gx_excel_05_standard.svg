  <g class="markers">
  <g class="route-marker" style="cursor:pointer" data-type="arrival" data-day="Day1" data-name="南宁园博园" data-plan="南宁园博园" data-lat="22.6869" data-lng="108.4812" data-spot-desc="南宁市 · 1. 抵达南宁，专人接站，入住南宁市悦年华颐养公寓；2. 适应气候环境，下午自由休息，开展健康建档与基础体检；3. 下午游览青秀山景区，漫步天然氧吧，呼吸清新空气；4. 晚上体验八段锦养生教学与适应性训练或夜游南湖公园，在慢节奏" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E5%8D%97%E5%AE%81%E5%9B%AD%E5%8D%9A%E5%9B%AD%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E5%8D%97%E5%AE%81%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(228,142)"><circle class="hit-area" r="21" fill="transparent" pointer-events="all"/><circle r="9" fill="#4CAF50" stroke="#fff" stroke-width="2"/><text class="svg-text" data-role="marker_glyph" text-anchor="middle" dy="4" fill="#fff" font-size="10" font-weight="bold">起</text><text class="svg-text" data-role="marker_name" y="20" text-anchor="middle" font-size="11" fill="#000" font-family="sans-serif">南宁园博园</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day2" data-name="北海银滩" data-plan="北海银滩" data-lat="21.4083" data-lng="109.14" data-spot-desc="南宁市 · 1. 8:30早餐后，晨练八段锦；2. 上午开展慢病管理健康讲座与一对一养老咨询；3. 午餐后午休1.5小时；4. 下午游览三街两巷历史文化街区，体验非遗手作，放松身心；5. 晚上体验瑶药足浴养生，自由休息" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E5%8C%97%E6%B5%B7%E9%93%B6%E6%BB%A9%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E5%8C%97%E6%B5%B7%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(513,382)"><circle class="hit-area" r="20" fill="transparent" pointer-events="all"/><circle r="8" fill="#FF7826" stroke="#fff" stroke-width="2"/><text class="svg-text" data-role="marker_glyph" text-anchor="middle" dy="4" fill="#fff" font-size="10" font-weight="bold">景</text><text class="svg-text" data-role="marker_name" y="19" text-anchor="middle" font-size="11" fill="#000" font-family="sans-serif">北海银滩</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day3" data-name="涠洲岛" data-plan="涠洲岛" data-lat="21.0288" data-lng="109.1017" data-spot-desc="南宁市→钦州市 · 1. 8:30早餐后出发，乘车前往钦州市（车程约1.5小时）；2. 抵达后入住康桥白鹭湾，午餐后午休1.5小时；3. 下午游览三娘湾景区，乘船观中华白海豚，体验渔家文化；4. 开展红树林养老漫步，呼吸高负氧离子空气；5." data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E6%B6%A0%E6%B4%B2%E5%B2%9B%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E5%8C%97%E6%B5%B7%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(497,454)"><circle class="hit-area" r="20" fill="transparent" pointer-events="all"/><circle r="8" fill="#FF7826" stroke="#fff" stroke-width="2"/><text class="svg-text" data-role="marker_glyph" text-anchor="middle" dy="4" fill="#fff" font-size="10" font-weight="bold">景</text><text class="svg-text" data-role="marker_name" y="18" text-anchor="middle" font-size="10" fill="#000" font-family="sans-serif">涠洲岛</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day4" data-name="钦州三娘湾" data-plan="钦州三娘湾" data-lat="21.6087" data-lng="108.6134" data-spot-desc="钦州市 · 1. 8:30早餐后，晨练太极；2. 上午游览钦州老街，体验坭兴陶非遗手作，在慢创作中放松身心；3. 午餐后午休1.5小时；4. 下午开展滨海养老漫游，沿钦州湾观光，体验养身茶品鉴；5. 晚上开展健养老生讲座，体验足部理疗，自由" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E9%92%A6%E5%B7%9E%E4%B8%89%E5%A8%98%E6%B9%BE%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E9%92%A6%E5%B7%9E%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(286,345)"><circle class="hit-area" r="20" fill="transparent" pointer-events="all"/><circle r="8" fill="#FF7826" stroke="#fff" stroke-width="2"/><text class="svg-text" data-role="marker_glyph" text-anchor="middle" dy="4" fill="#fff" font-size="10" font-weight="bold">景</text><text class="svg-text" data-role="marker_name" y="20" text-anchor="middle" font-size="12" fill="#000" font-family="sans-serif">钦州三娘湾</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="departure" data-day="Day5" data-name="防城港白龙半岛" data-plan="防城港白龙半岛" data-lat="21.55" data-lng="108.2" data-spot-desc="钦州市→防城港市 · 1. 8:30早餐后出发，乘车前往防城港市（车程约1小时）；2. 抵达后入住广旅广悦臻酒店分公司，午餐后午休1.5小时；3. 下午游览十万大山国家森林公园，开展森林养老徒步，体验负氧离子疗愈；4. 晚上体验中药熏蒸养老" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E9%98%B2%E5%9F%8E%E6%B8%AF%E7%99%BD%E9%BE%99%E5%8D%8A%E5%B2%9B%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E9%98%B2%E5%9F%8E%E6%B8%AF%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(107,356)"><circle class="hit-area" r="21" fill="transparent" pointer-events="all"/><circle r="9" fill="#1976D2" stroke="#fff" stroke-width="2"/><text class="svg-text" data-role="marker_glyph" text-anchor="middle" dy="4" fill="#fff" font-size="10" font-weight="bold">返</text><text class="svg-text" data-role="marker_name" y="20" text-anchor="middle" font-size="11" fill="#000" font-family="sans-serif">防城港白龙半岛</text></g>
