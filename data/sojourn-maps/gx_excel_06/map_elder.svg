  <g class="route-marker" style="cursor:pointer" data-type="arrival" data-day="Day1" data-name="宁明花山岩画" data-plan="宁明花山岩画" data-lat="22.14" data-lng="107.072" data-spot-desc="南宁市 · 1. 抵达南宁，专人接站，入住中国（南宁）乐养城；2. 健康建档与基础体检，适应广西气候；3. 下午游览青秀山风景区，开展森林养老漫步；4. 晚上体验壮药足浴养生，八段锦适应性训练" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E8%8A%B1%E5%B1%B1%E5%B2%A9%E7%94%BB%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E5%B4%87%E5%B7%A6%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(331,454)"><circle class="hit-area" r="22" fill="transparent" pointer-events="all"/><circle r="10" fill="#4CAF50" stroke="#fff" stroke-width="2"/><text class="svg-text" data-role="marker_glyph" text-anchor="middle" dy="5" fill="#fff" font-size="13" font-weight="bold">起</text><text class="svg-text" data-role="marker_name" y="24" text-anchor="middle" font-size="14" fill="#000" font-family="sans-serif">宁明花山岩画</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day2" data-name="大新德天瀑布" data-plan="大新德天瀑布" data-lat="22.849" data-lng="106.726" data-spot-desc="南宁市→崇左市 · 1. 8:30早餐后晨练，健康讲堂；2、户外山水治疗愈；午餐后午休；3. 下午游石景林风景区，开展喀斯特地貌养老漫步；4. 晚上体验壮药理疗" data-spot-img="https://dimg04.c-ctrip.com/images/300m1200000rpb33D9F36_W_640_0_Q90.jpg" transform="translate(107,143)"><circle class="hit-area" r="21" fill="transparent" pointer-events="all"/><circle r="9" fill="#FF7826" stroke="#fff" stroke-width="2"/><text class="svg-text" data-role="marker_glyph" text-anchor="middle" dy="5" fill="#fff" font-size="13" font-weight="bold">景</text><text class="svg-text" data-role="marker_name" y="22" text-anchor="middle" font-size="13" fill="#000" font-family="sans-serif">大新德天瀑布</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day3" data-name="明仕田园" data-plan="明仕田园" data-lat="22.85" data-lng="107.1" data-spot-desc="崇左市→宁明县 · 1. 8:30早餐后出发，乘车前往宁明县（车程约1小时）；2. 抵达后入住宁明县旅居养老基地，午餐后午休；3. 下午游览花山岩画景区，体验非遗文化研学；4. 开展派阳山森林公园森林养老徒步，呼吸高负氧离子空气；5. 晚上" data-spot-img="https://dimg04.c-ctrip.com/images/300k1200000rnweaN442F_W_640_0_Q90.jpg" transform="translate(349,142)"><circle class="hit-area" r="21" fill="transparent" pointer-events="all"/><circle r="9" fill="#FF7826" stroke="#fff" stroke-width="2"/><text class="svg-text" data-role="marker_glyph" text-anchor="middle" dy="5" fill="#fff" font-size="13" font-weight="bold">景</text><text class="svg-text" data-role="marker_name" y="22" text-anchor="middle" font-size="13" fill="#000" font-family="sans-serif">明仕田园</text></g>
