  <g class="route-marker" style="cursor:pointer" data-type="arrival" data-day="Day1" data-name="桂林象鼻山" data-plan="桂林象鼻山" data-lat="25.2736" data-lng="110.2923" data-spot-desc="桂林市 · 1. 抵达桂林，专人接站，入住桂林璟象酒店；2. 健康建档与基础体检，适应广西气候；3. 下午游览象鼻山景区，开展滨江养老漫步；4. 晚上体验八段锦养生教学，夜游四湖静心养老" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E6%A1%82%E6%9E%97%E8%B1%A1%E9%BC%BB%E5%B1%B1%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E6%A1%82%E6%9E%97%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(107,142)"><circle class="hit-area" r="32" fill="transparent" pointer-events="all"/><circle r="18" fill="#4CAF50" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">起</text><text y="60" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">桂林象鼻山</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day2" data-name="阳朔漓江" data-plan="阳朔漓江" data-lat="24.7739" data-lng="110.494" data-spot-desc="桂林市→阳朔县 · 1. 8:30早餐后出发，乘车前往竹江码头（车程约1小时）；2. 乘坐漓江游船，开展百里画廊生态氧疗；3. 抵达阳朔后入住广悦华阳朔河畔度假酒店，午餐后午休；4. 下午游览遇龙河景区，开展田园养老漫步；5. 晚上体验瑶药" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E9%98%B3%E6%9C%94%E6%BC%93%E6%B1%9F%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E6%A1%82%E6%9E%97%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(174,331)"><circle class="hit-area" r="29" fill="transparent" pointer-events="all"/><circle r="15" fill="#FF7826" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">景</text><text y="57" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">阳朔漓江</text></g>
  <g class="route-marker" style="cursor:pointer" data-type="spot" data-day="Day3" data-name="贺州温泉" data-plan="贺州温泉" data-lat="24.45" data-lng="111.52" data-spot-desc="阳朔县 · 1. 8:30早餐后，晨练八段锦；2. 上午游览世外桃源景区，开展田园秘境养老；3. 午餐后午休；4. 下午游览西街，体验非遗文化研学；5. 晚上体验印象·刘三姐文化演出，文化润心" data-spot-img="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%231FA97E%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%230E7C86%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22640%22%20height%3D%22360%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%22320%22%20y%3D%22165%22%20text-anchor%3D%22middle%22%20fill%3D%22%23fff%22%20font-size%3D%2242%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%20font-weight%3D%22700%22%3E%E8%B4%BA%E5%B7%9E%E6%B8%A9%E6%B3%89%3C%2Ftext%3E%3Ctext%20x%3D%22320%22%20y%3D%22220%22%20text-anchor%3D%22middle%22%20fill%3D%22rgba(255%2C255%2C255%2C.9)%22%20font-size%3D%2222%22%20font-family%3D%22Microsoft%20YaHei%2Csans-serif%22%3E%E8%B4%BA%E5%B7%9E%20%C2%B7%20%E6%9C%AC%E5%9C%B0%E7%9F%A5%E8%AF%86%E5%BA%93%3C%2Ftext%3E%3C%2Fsvg%3E" transform="translate(518,463)"><circle class="hit-area" r="29" fill="transparent" pointer-events="all"/><circle r="15" fill="#FF7826" stroke="#fff" stroke-width="2"/><text text-anchor="middle" dy="15" fill="#fff" font-size="42" font-weight="bold">景</text><text y="57" text-anchor="middle" font-size="42" fill="#000" font-family="sans-serif">贺州温泉</text></g>
