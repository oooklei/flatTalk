<svg viewBox="0 0 620 850" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="width:100%;max-width:620px;background:linear-gradient(180deg,#F5F0E8 0%,#E8F4E8 100%);border-radius:16px;font-family:'PingFang SC','Microsoft YaHei',sans-serif" data-route-id="bama_5d4n" data-version="rich" data-route-name="巴马5天4晚康养旅居" data-center-lat="24.15" data-center-lng="107.25">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#64B5F6" stop-opacity="0.8"/><stop offset="100%" stop-color="#1976D2" stop-opacity="0.6"/></linearGradient>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#81C784" stop-opacity="0.7"/><stop offset="100%" stop-color="#388E3C" stop-opacity="0.4"/></linearGradient>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#90CAF9" stop-opacity="0.85"/><stop offset="100%" stop-color="#42A5F5" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF7826"/><stop offset="100%" stop-color="#E65100"/></linearGradient>
    <!-- 走线颜色：起点绿、途径橙、终点蓝、返程红 -->
    <linearGradient id="startLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E7D32"/><stop offset="100%" stop-color="#43A047"/></linearGradient>
    <linearGradient id="viaLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF7826"/><stop offset="100%" stop-color="#FF9800"/></linearGradient>
    <linearGradient id="endLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1976D2"/><stop offset="100%" stop-color="#42A5F5"/></linearGradient>
    <linearGradient id="returnLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#D32F2F"/><stop offset="100%" stop-color="#EF5350"/></linearGradient>
    <!-- 箭头标记 -->
    <marker id="arrowStart" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 8 5 L 0 9 z" fill="#2E7D32"/></marker>
    <marker id="arrowVia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 8 5 L 0 9 z" fill="#FF7826"/></marker>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 8 5 L 0 9 z" fill="#1976D2"/></marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 8 5 L 0 9 z" fill="#D32F2F"/></marker>
    <!-- 发光和阴影效果 -->
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/></filter>
    <filter id="imgShadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/></filter>
    <!-- 景点图片裁剪 -->
    <clipPath id="imgClip"><rect x="0" y="0" width="100" height="70" rx="8"/></clipPath>
  </defs>

  <!-- ========== 标题栏 ========== -->
  <rect x="0" y="0" width="620" height="58" rx="16" fill="url(#heroGrad)"/>
  <text x="18" y="38" fill="#fff" font-size="22" font-weight="bold">巴马5天4晚康养旅居路线</text>
  <text x="18" y="52" fill="rgba(255,255,255,0.75)" font-size="11">广西·河池·巴马瑶族自治县 | 世界长寿之乡</text>

  <!-- ========== 地理底图 ========== -->
  <rect x="10" y="68" width="600" height="520" rx="12" fill="#F5F8F5" stroke="#C8D8C0" stroke-width="0.8"/>

  <!-- 喀斯特峰林群（西北） -->
  <g opacity="0.5">
    <path d="M25,130 Q42,85 58,132 Q72,80 92,132 Q108,75 128,132 Q145,72 165,132 Q180,78 200,132 Q215,70 235,132" fill="url(#hillGrad)" stroke="#4CAF50" stroke-width="0.6"/>
    <path d="M50,185 Q65,145 82,188 Q95,138 112,188 Q125,140 142,188" fill="url(#hillGrad)" stroke="#4CAF50" stroke-width="0.5"/>
    <path d="M220,168 Q235,130 252,172 Q268,125 285,172 Q300,128 318,172 Q332,122 350,172" fill="url(#hillGrad)" stroke="#4CAF50" stroke-width="0.5"/>
    <path d="M350,220 Q365,185 380,225 Q392,178 408,225 Q420,180 435,225" fill="url(#hillGrad)" stroke="#4CAF50" stroke-width="0.4"/>
  </g>
  <text x="150" y="115" fill="#2E7D32" font-size="10" opacity="0.55" font-style="italic">喀斯特峰林</text>
  <text x="280" y="160" fill="#2E7D32" font-size="9" opacity="0.5" font-style="italic">丘陵地带</text>

  <!-- 盘阳河（母亲河） -->
  <path d="M35,285 Q85,250 140,275 Q200,255 260,280 Q320,265 370,295 Q420,315 460,350 Q495,380 520,420" fill="none" stroke="url(#riverGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M35,285 Q85,250 140,275 Q200,255 260,280 Q320,265 370,295 Q420,315 460,350 Q495,380 520,420" fill="none" stroke="#64B5F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <text x="180" y="270" fill="#1565C0" font-size="11" font-weight="bold" opacity="0.8">盘阳河</text>
  <text x="180" y="283" fill="#1976D2" font-size="8" opacity="0.6">巴马母亲河</text>

  <!-- 命河（"命"字河道） -->
  <path d="M130,195 Q140,215 145,235 Q132,248 140,262 Q148,248 152,232 Q158,212 165,192" fill="none" stroke="#64B5F6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <text x="145" y="188" fill="#1565C0" font-size="9" text-anchor="middle" opacity="0.75">命河</text>

  <!-- 赐福湖 -->
  <ellipse cx="420" cy="380" rx="75" ry="48" fill="url(#lakeGrad)" stroke="#42A5F5" stroke-width="1.2" opacity="0.75"/>
  <ellipse cx="395" cy="368" rx="12" ry="7" fill="#81C784" stroke="#4CAF50" stroke-width="0.6" opacity="0.55"/>
  <ellipse cx="430" cy="395" rx="9" ry="6" fill="#81C784" stroke="#4CAF50" stroke-width="0.6" opacity="0.55"/>
  <ellipse cx="440" cy="372" rx="8" ry="5" fill="#81C784" stroke="#4CAF50" stroke-width="0.6" opacity="0.55"/>
  <ellipse cx="450" cy="388" rx="7" ry="4" fill="#81C784" stroke="#4CAF50" stroke-width="0.6" opacity="0.5"/>
  <text x="420" y="385" fill="#0D47A1" font-size="12" text-anchor="middle" font-weight="bold" opacity="0.85">赐福湖</text>
  <text x="420" y="400" fill="#1565C0" font-size="8" text-anchor="middle" opacity="0.6">百岛长湖</text>

  <!-- 巴马县城 -->
  <rect x="355" y="260" width="78" height="26" rx="8" fill="#fff" stroke="#999" stroke-width="0.6" opacity="0.9" filter="url(#shadow)"/>
  <text x="394" y="278" fill="#333" font-size="11" text-anchor="middle" font-weight="bold">巴马县城</text>

  <!-- ========== 走线（起点绿→途径橙→终点蓝→返程红） ========== -->
  <g class="route-paths" filter="url(#glow)">
    <!-- 【起点线】县城→百魔洞（绿色） -->
    <path d="M394,286 Q340,255 260,225" fill="none" stroke="url(#startLine)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowStart)" opacity="0.9">
      <title>起点：前往百魔洞</title>
    </path>
    <!-- 【途径线】百魔洞→长寿村→命河→百鸟岩→水晶宫→赐福湖（橙色） -->
    <path d="M260,225 Q220,240 190,260 Q170,280 165,305" fill="none" stroke="url(#viaLine)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowVia)" opacity="0.9"/>
    <path d="M165,305 Q155,290 150,275" fill="none" stroke="url(#viaLine)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowVia)" opacity="0.9"/>
    <path d="M150,275 Q125,255 100,235" fill="none" stroke="url(#viaLine)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowVia)" opacity="0.9"/>
    <path d="M100,235 Q75,195 65,155" fill="none" stroke="url(#viaLine)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowVia)" opacity="0.9"/>
    <path d="M65,155 Q120,185 200,220 Q300,270 380,355 Q400,370 420,378" fill="none" stroke="url(#viaLine)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowVia)" opacity="0.9"/>
    <!-- 【返程线】赐福湖→县城（红色虚线） -->
    <path d="M420,395 Q400,360 380,340 Q360,310 394,290" fill="none" stroke="url(#returnLine)" stroke-width="4" stroke-dasharray="8 5" stroke-linecap="round" marker-end="url(#arrowReturn)" opacity="0.75">
      <title>返程：返回巴马县城</title>
    </path>
  </g>

  <!-- ========== 景点标注（含图片） ========== -->
  <g class="markers">
    <!-- 【起点】巴马县城 -->
    <g class="marker" data-type="start" data-name="巴马县城" data-plan="抵达巴马·康养起点" data-lat="24.12" data-lng="107.25" transform="translate(394,286)">
      <circle r="18" fill="#2E7D32" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
      <text text-anchor="middle" dy="6" fill="#fff" font-size="14" font-weight="bold">起</text>
      <text y="30" text-anchor="middle" font-size="11" fill="#1B5E20" font-weight="bold">巴马县城</text>
      <text y="42" text-anchor="middle" font-size="8" fill="#555">康养旅居起点</text>
    </g>

    <!-- 【途径点】百魔洞 -->
    <g class="marker" data-type="spot" data-day="Day1-2" data-name="百魔洞" data-plan="天下第一洞·负氧离子磁疗" data-lat="24.15" data-lng="107.05" data-spot-desc="百魔洞是巴马最著名的溶洞景点，洞内钟乳石千姿百态，石笋林立，洞厅宏伟壮观。洞内富含负氧离子和地磁，被誉为'天然氧吧'和'磁场养生圣地'。" transform="translate(260,225)">
      <circle r="18" fill="#FF7826" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
      <text text-anchor="middle" dy="6" fill="#fff" font-size="14" font-weight="bold">景</text>
      <text y="28" text-anchor="middle" font-size="11" fill="#BF360C" font-weight="bold">百魔洞</text>
      <text y="40" text-anchor="middle" font-size="7" fill="#888">负氧离子2-7万/cm³</text>
      <!-- 景点小图预览 -->
      <g transform="translate(25,-25)">
        <rect x="0" y="0" width="90" height="60" rx="6" fill="#fff" stroke="#ddd" stroke-width="0.5" filter="url(#imgShadow)"/>
        <image xlink:href="https://dimg04.c-ctrip.com/images/1mf2h12000be4fpbd5CEC_W_640_0_Q90.jpg?proc=autoorient" x="2" y="2" width="86" height="56" preserveAspectRatio="xMidYMid slice" clip-path="url(#imgClip)" opacity="0.9"/>
      </g>
    </g>

    <!-- 【途径点】长寿村 -->
    <g class="marker" data-type="wellness" data-day="Day3" data-name="长寿村" data-plan="探访百岁老人·养生文化" data-lat="24.10" data-lng="107.15" data-spot-desc="长寿村即巴盘屯，是世界著名的长寿之乡。村内百岁老人众多，被誉为'世界长寿之乡'的典型代表。" transform="translate(165,305)">
      <circle r="18" fill="#1976D2" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
      <text text-anchor="middle" dy="6" fill="#fff" font-size="14" font-weight="bold">养</text>
      <text y="28" text-anchor="middle" font-size="11" fill="#0D47A1" font-weight="bold">长寿村</text>
      <text y="40" text-anchor="middle" font-size="7" fill="#888">百岁老人7位/515人</text>
      <g transform="translate(-95,-20)">
        <rect x="0" y="0" width="90" height="60" rx="6" fill="#fff" stroke="#ddd" stroke-width="0.5" filter="url(#imgShadow)"/>
        <image xlink:href="https://www.gxlvyouwang.com/uploads/allimg/20250806/1-250P6000045507.jpg" x="2" y="2" width="86" height="56" preserveAspectRatio="xMidYMid slice" opacity="0.9"/>
      </g>
    </g>

    <!-- 【途径点】命河 -->
    <g class="marker" data-type="spot" data-day="Day3" data-name="命河" data-plan="命字河道奇观" data-lat="24.12" data-lng="107.10" data-spot-desc="命河是巴马母亲河盘阳河的一段，因河道蜿蜒曲折，形似'命'字而得名。" transform="translate(150,275)">
      <circle r="15" fill="#FF7826" stroke="#fff" stroke-width="2.5" filter="url(#shadow)"/>
      <text text-anchor="middle" dy="5" fill="#fff" font-size="12" font-weight="bold">景</text>
      <text y="-30" text-anchor="end" font-size="10" fill="#BF360C" font-weight="bold">命河</text>
      <text y="-18" text-anchor="end" font-size="7" fill="#888">"命"字河道</text>
    </g>

    <!-- 【途径点】百鸟岩 -->
    <g class="marker" data-type="spot" data-day="Day4" data-name="百鸟岩" data-plan="乘船穿越三天三夜" data-lat="24.18" data-lng="107.00" data-spot-desc="百鸟岩又名百魔洞支洞，是巴马第二大溶洞景观。洞内钟乳石洁白晶莹，似鸟似兽，惟妙惟肖。" transform="translate(100,235)">
      <circle r="16" fill="#FF7826" stroke="#fff" stroke-width="2.5" filter="url(#shadow)"/>
      <text text-anchor="middle" dy="6" fill="#fff" font-size="13" font-weight="bold">景</text>
      <text y="-30" text-anchor="end" font-size="10" fill="#BF360C" font-weight="bold">百鸟岩</text>
      <text y="-18" text-anchor="end" font-size="7" fill="#888">三天三夜奇观</text>
      <g transform="translate(-95,-35)">
        <rect x="0" y="0" width="90" height="60" rx="6" fill="#fff" stroke="#ddd" stroke-width="0.5" filter="url(#imgShadow)"/>
        <image xlink:href="https://dimg04.c-ctrip.com/images/1mf6o12000be4fnjz1ADB_W_640_0_Q90.jpg?proc=autoorient" x="2" y="2" width="86" height="56" preserveAspectRatio="xMidYMid slice" opacity="0.9"/>
      </g>
    </g>

    <!-- 【途径点】水晶宫 -->
    <g class="marker" data-type="spot" data-day="Day4" data-name="水晶宫" data-plan="溶洞天花板·鹅管群" data-lat="24.30" data-lng="106.95" data-spot-desc="水晶宫是巴马最具代表性的溶洞之一，以其晶莹剔透的钟乳石闻名。洞内恒温恒湿，富含多种对人体有益的微量元素。" transform="translate(65,155)">
      <circle r="16" fill="#FF7826" stroke="#fff" stroke-width="2.5" filter="url(#shadow)"/>
      <text text-anchor="middle" dy="6" fill="#fff" font-size="13" font-weight="bold">景</text>
      <text y="28" text-anchor="middle" font-size="10" fill="#BF360C" font-weight="bold">水晶宫</text>
      <text y="40" text-anchor="middle" font-size="7" fill="#888">溶洞天花板·恒温18℃</text>
      <g transform="translate(25,10)">
        <rect x="0" y="0" width="90" height="60" rx="6" fill="#fff" stroke="#ddd" stroke-width="0.5" filter="url(#imgShadow)"/>
        <image xlink:href="https://www.365135.com/upimg/userup/2509/0210525224Q.jpg" x="2" y="2" width="86" height="56" preserveAspectRatio="xMidYMid slice" opacity="0.9"/>
      </g>
    </g>

    <!-- 【终点】赐福湖 -->
    <g class="marker" data-type="wellness" data-day="Day4-5" data-name="赐福湖" data-plan="百岛长湖·游船疗养" data-lat="24.08" data-lng="107.30" data-spot-desc="赐福湖是巴马最大的人工湖，湖水清澈，四周青山环抱。湖畔有长寿岛、赐福长寿村等景点，是康养度假的理想之地。" transform="translate(420,378)">
      <circle r="18" fill="#1976D2" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
      <text text-anchor="middle" dy="6" fill="#fff" font-size="13" font-weight="bold">终</text>
      <text y="28" text-anchor="middle" font-size="10" fill="#0D47A1" font-weight="bold">赐福湖</text>
      <text y="40" text-anchor="middle" font-size="7" fill="#888">3万亩·百岛长湖</text>
      <g transform="translate(25,-10)">
        <rect x="0" y="0" width="90" height="60" rx="6" fill="#fff" stroke="#ddd" stroke-width="0.5" filter="url(#imgShadow)"/>
        <image xlink:href="https://static.gxrb.com.cn/image/uploadpic/20250711/e4f615339c84ec5c514998b9ba95d6b4.jpg" x="2" y="2" width="86" height="56" preserveAspectRatio="xMidYMid slice" opacity="0.9"/>
      </g>
    </g>

    <!-- 【返程标记】 -->
    <g class="marker" data-type="return" data-day="Day5" data-name="返程" data-plan="盘阳河漂流·返回县城" transform="translate(394,290)">
      <circle r="14" fill="#D32F2F" stroke="#fff" stroke-width="2.5" filter="url(#shadow)"/>
      <text text-anchor="middle" dy="5" fill="#fff" font-size="12" font-weight="bold">返</text>
    </g>
  </g>

  <!-- ========== 日标签 ========== -->
  <g class="day-labels" font-size="9" fill="#fff" font-weight="bold">
    <rect x="270" y="208" width="40" height="18" rx="9" fill="#2E7D32" opacity="0.95"/><text x="290" y="221" text-anchor="middle">Day1</text>
    <rect x="275" y="175" width="40" height="18" rx="9" fill="#FF9800" opacity="0.95"/><text x="295" y="188" text-anchor="middle">Day2</text>
    <rect x="180" y="280" width="40" height="18" rx="9" fill="#1976D2" opacity="0.95"/><text x="200" y="293" text-anchor="middle">Day3</text>
    <rect x="25" y="130" width="40" height="18" rx="9" fill="#FF7826" opacity="0.95"/><text x="45" y="143" text-anchor="middle">Day4</text>
    <rect x="455" y="395" width="40" height="18" rx="9" fill="#D32F2F" opacity="0.95"/><text x="475" y="408" text-anchor="middle">Day5</text>
  </g>

  <!-- ========== 特色标注卡片 ========== -->
  <g transform="translate(490,95)" opacity="0.88">
    <rect x="0" y="0" width="110" height="55" rx="10" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
    <text x="55" y="18" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold">高负氧离子</text>
    <text x="55" y="34" text-anchor="middle" font-size="9" fill="#388E3C">2-7万个/cm³</text>
    <text x="55" y="48" text-anchor="middle" font-size="8" fill="#66BB6A">天然氧吧·洗肺圣地</text>
  </g>
  <g transform="translate(490,160)" opacity="0.88">
    <rect x="0" y="0" width="110" height="50" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
    <text x="55" y="18" text-anchor="middle" font-size="10" fill="#0D47A1" font-weight="bold">弱碱性小分子水</text>
    <text x="55" y="34" text-anchor="middle" font-size="9" fill="#1565C0">pH 7.8-8.3</text>
  </g>
  <g transform="translate(490,220)" opacity="0.88">
    <rect x="0" y="0" width="110" height="50" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
    <text x="55" y="18" text-anchor="middle" font-size="10" fill="#BF360C" font-weight="bold">高地磁环境</text>
    <text x="55" y="34" text-anchor="middle" font-size="9" fill="#E65100">0.58高斯</text>
  </g>

  <!-- ========== 图例 ========== -->
  <g class="legend" transform="translate(15,598)">
    <rect x="0" y="0" width="590" height="32" rx="8" fill="rgba(255,255,255,0.95)" stroke="#ddd" stroke-width="0.5" filter="url(#shadow)"/>
    <circle cx="22" cy="16" r="6" fill="#2E7D32"/><text x="35" y="20" font-size="11" fill="#333">起点</text>
    <circle cx="90" cy="16" r="6" fill="#FF7826"/><text x="103" y="20" font-size="11" fill="#333">途径景点</text>
    <circle cx="190" cy="16" r="6" fill="#1976D2"/><text x="203" y="20" font-size="11" fill="#333">康养基地/终点</text>
    <circle cx="310" cy="16" r="6" fill="#D32F2F"/><text x="323" y="20" font-size="11" fill="#333">返程</text>
    <line x1="385" y1="16" x2="420" y2="16" stroke="#FF7826" stroke-width="4" stroke-linecap="round"/><text x="430" y="20" font-size="11" fill="#333">走线</text>
    <line x1="475" y1="16" x2="510" y2="16" stroke="#64B5F6" stroke-width="4" stroke-linecap="round"/><text x="520" y="20" font-size="11" fill="#333">河流</text>
  </g>

  <!-- ========== 底部信息栏 ========== -->
