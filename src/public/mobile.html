<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>&#26690;&#23567;&#20859;&#31227;&#21160;&#31471;</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260730-encodingfix3" />

    <script>
      window.__DEVICE_TYPE__ = 'mobile';
      window.__MOBILE_BUILD_ID__ = '20260730-route-real1';
    </script>
    <script src="/device-redirect.js?v=20260730-route-real1"></script>

    <link rel="stylesheet" href="/mobile.css?v=20260730-route-real1" />

    <style>
      .device-badge-mobile {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9998;
        padding: 4px 12px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 12px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.85);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        backdrop-filter: blur(8px);
        pointer-events: none;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity 0.3s;
      }
    </style>
  </head>
  <body>
    <main id="mobileRoot" class="mobile-root">
      <div class="phone-screen">
        <div class="mobile-loading">&#27491;&#22312;&#36827;&#20837;&#26690;&#23567;&#20859;...</div>
      </div>
    </main>
    <script src="/mobile.js?v=20260730-route-real1" type="module"></script>

    <div id="device-badge-mobile" class="device-badge-mobile" data-debug-only style="display:none;">
      <span id="device-badge-mobile-info">&#26816;&#27979;&#20013;...</span>
    </div>

    <div id="device-switch" data-debug-only></div>
    <script src="/device-switch.js?v=20260730-route-real1"></script>

    <script>
      (function() {
        var isDebug = /[?&]debug=1([&#]|$)/.test(location.search) || /[?&]__DEV__([&#=]|$)/.test(location.search);
        if (isDebug) {
          document.body.classList.add('debug-mode');
        }

        var info = window.__DEVICE_INFO__;
        var badge = document.getElementById('device-badge-mobile');
        var badgeInfo = document.getElementById('device-badge-mobile-info');
        if (isDebug && info && badge && badgeInfo) {
          var text = info.deviceTypeName + ' / ' + info.browserName;
          if (info.browserVersion) text += ' ' + info.browserVersion;
          text += ' / ' + info.osName + ' ' + (info.osVersion || '');
          badgeInfo.textContent = text;
          badge.style.display = 'block';

          setTimeout(function() {
            badge.style.opacity = '0.3';
          }, 4000);
        }
      })();
    </script>
  </body>
</html>
