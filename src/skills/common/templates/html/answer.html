<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桂小养答复</title>
<style>
  :root {
    --bg: #FAF8F5; --card: #FFFFFF; --ink: #3D3A36; --ink2: #8A8278; --line: #E4E0D8;
    --o500: #E8843C; --o600: #D06E2A; --o50: #FDF6F0; --o100: #FAE6D5;
    --shadow: 0 4px 18px rgba(62,56,50,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 8px 10px 6px; display: flex; justify-content: center; align-items: flex-start;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--o50) 0%, var(--bg) 48%, #E8F0F5 100%);
    color: var(--ink); min-height: 0; height: auto;
  }
  .gxy-card {
    width: 100%; max-width: 420px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .gxy-card__head {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: linear-gradient(145deg, #E8843C 0%, #F0B487 100%); color: #fff;
  }
  .gxy-card__emoji {
    width: 36px; height: 36px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.22); font-size: 20px;
  }
  .gxy-card__title { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .5px; }
  .gxy-card__sub { font-size: 12px; opacity: .92; margin-top: 2px; }
  .gxy-card__body { padding: 10px 12px; background: var(--o50); }
  .gxy-card__answer {
    margin: 0; padding: 10px 12px; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; font-size: 15px; line-height: 1.65; color: var(--ink);
  }
  .gxy-card__rel {
    margin-top: 8px; padding: 8px 12px; background: var(--o100);
    border-left: 3px solid var(--o500); border-radius: 0 12px 12px 0;
    font-size: 13.5px; color: var(--ink);
  }
  .gxy-card__foot {
    padding: 6px 14px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink2); text-align: right; background: #fff;
  }
</style>
</head>
<body>
<article class="gxy-card gxy-card--answer" data-template-id="answer" data-layout="vertical">
  <header class="gxy-card__head">
    <span class="gxy-card__emoji">{{emoji|💬}}</span>
    <div>
      <h3 class="gxy-card__title">{{title|桂小养答复}}</h3>
      <div class="gxy-card__sub">{{skill_name|温润适老 · 智慧相伴}}</div>
    </div>
  </header>
  <div class="gxy-card__body">
    <p class="gxy-card__answer">{{answer|已收到您的问题，我会结合您的历史对话与健康状况，为您提供个性化建议。}}</p>
    {{#related_questions}}
    <div class="gxy-card__rel">🔗 {{related_questions}}</div>
    {{/related_questions}}
  </div>
  <footer class="gxy-card__foot">{{foot|桂颐智养 · 桂小养}}</footer>
</article>
<script type="application/json">
{
  "emoji": "💬",
  "title": "桂小养答复",
  "skill_name": "温润适老 · 智慧相伴",
  "answer": "已收到您的问题，我会结合您的历史对话与健康状况，为您提供个性化建议。如需更精准的方案，可补充年龄、既往史与近期指标。",
  "related_questions": "",
  "foot": "桂颐智养 · 桂小养"
}
</script>
</body>
</html>
