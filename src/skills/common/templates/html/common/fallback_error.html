<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>异常返回兜底卡片</title>
<style>
  :root {
    --bg: #fbfbfc; --card: #fff; --ink: #2b2f33; --ink2: #6b7280; --line: #eceff3;
    --accent: #d9534f; --accent-soft: #fdecec; --shadow: 0 6px 18px rgba(20,30,40,.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--ink); padding: 16px; display: flex; justify-content: center; }
  .gxy-card { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .gxy-card__head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: linear-gradient(135deg, #d9534f, #e8807c); color: #fff; }
  .gxy-card__emoji { font-size: 26px; line-height: 1; }
  .gxy-card__title { margin: 0; font-size: 17px; font-weight: 700; }
  .gxy-card__sub { font-size: 12.5px; opacity: .92; margin-top: 2px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .gxy-card__body { padding: 16px 18px; font-size: 14.5px; line-height: 1.7; }
  .gxy-card__msg { margin: 0 0 10px; }
  .gxy-card__block { margin-top: 10px; padding: 12px 14px; background: var(--accent-soft); border-radius: 12px; font-size: 13.5px; color: var(--ink); }
  .gxy-card__block b { color: var(--accent); }
  .gxy-card__foot { padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink2); text-align: right; }
</style>
</head>
<body>
<article class="gxy-card gxy-card--error" data-template-id="fallback_error" data-layout="vertical">
  <header class="gxy-card__head">
    <span class="gxy-card__emoji">{{emoji|⚠️}}</span>
    <div>
      <h3 class="gxy-card__title">{{title|出错了}}</h3>
      <div class="gxy-card__sub">{{code|ERROR}}</div>
    </div>
  </header>
  <div class="gxy-card__body">
    <p class="gxy-card__msg">{{message|服务暂时不可用，请稍后重试。}}</p>
    {{#detail}}
    <div class="gxy-card__block">📋 <b>详情：</b>{{detail}}</div>
    {{/detail}}
    {{#suggestion}}
    <div class="gxy-card__block">💡 <b>建议：</b>{{suggestion}}</div>
    {{/suggestion}}
  </div>
  <footer class="gxy-card__foot">{{foot|桂小养健康助手}}</footer>
</article>
<script type="application/json">
{
  "emoji": "⚠️",
  "title": "出错了",
  "code": "SERVICE_ERROR",
  "message": "服务暂时不可用，请稍后重试。",
  "detail": "",
  "suggestion": "若问题持续，请查看运行日志或联系管理员。",
  "foot": "桂小养健康助手"
}
</script>
</body>
</html>
