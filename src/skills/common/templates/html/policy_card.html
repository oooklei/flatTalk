<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>养老政策咨询</title>
<style>
  :root {
    --bg: #FAF8F5;
    --card: #ffffff;
    --ink: #3D3A36;
    --muted: #8A8278;
    --line: #E4E0D8;
    --green: #6B9B7A;
    --green-2: #3D6B4D;
    --soft: #E8F2EC;
    --accent: #E8843C;
    --accent-soft: #FDF6F0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    padding: 12px;
    background: linear-gradient(180deg, #FDF6F0 0%, var(--bg) 50%, #E8F0F5 100%);
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.5;
  }

  .policy-card {
    max-width: 480px;
    margin: 0 auto;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: 0 4px 16px rgba(62, 56, 50, 0.08);
    overflow: hidden;
  }

  /* 头部：暖橙品牌头栏，禁止白板裸标题 */
  .policy-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: linear-gradient(145deg, #E8843C 0%, #F0B487 100%);
    color: #fff;
  }

  .policy-emoji { font-size: 22px; line-height: 1; }
  .policy-head-text { flex: 1; min-width: 0; }
  .policy-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
  .policy-subtitle { margin-top: 1px; font-size: 11px; opacity: 0.9; }

  /* 核心回答区 */
  .policy-answer {
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
  }

  /* 政策条目列表 */
  .policy-list { padding: 10px 12px; }

  .policy-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    background: var(--soft);
    font-size: 13px;
    line-height: 1.6;
  }

  .policy-item:last-child { margin-bottom: 0; }

  .policy-item-icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
  }

  .policy-item-content { flex: 1; min-width: 0; }

  /* 条目标题：作为分类标签 */
  .policy-item-label {
    display: inline-block;
    padding: 2px 8px;
    margin-bottom: 4px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
  }

  /* 条目详情 */
  .policy-item-detail {
    color: var(--muted);
    font-size: 13px;
  }

  /* 底部提示 */
  .policy-foot {
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<article class="policy-card" data-template-id="policy_card" data-layout="vertical">
  <header class="policy-head">
    <span class="policy-emoji">{{emoji|📋}}</span>
    <div class="policy-head-text">
      <h3 class="policy-title">{{title|养老政策咨询}}</h3>
      <div class="policy-subtitle">{{skill_name|政策与服务指引}}</div>
    </div>
  </header>

  <section class="policy-answer">{{answer|可查询高龄津贴、长护险、社区居家养老服务、助餐补贴、适老化改造等政策。请补充所在城市、老人年龄、户籍和失能情况，我可以继续整理申请条件和办理材料。}}</section>

  <section class="policy-list">
    {{#policy_items}}
    <div class="policy-item">
      <div class="policy-item-icon">{{icon|1}}</div>
      <div class="policy-item-content">
        <span class="policy-item-label">{{label|补贴政策}}</span>
        <div class="policy-item-detail">{{detail|高龄津贴、护理补贴、困难老人补助等，与年龄、户籍、经济状况、能力评估相关。}}</div>
      </div>
    </div>
    {{/policy_items}}
  </section>

  <footer class="policy-foot">{{foot|以上为一般性政策整理，具体标准以当地民政、人社部门最新规定为准。}}</footer>
</article>
<script type="application/json">
{
  "emoji": "📋",
  "title": "养老政策咨询",
  "skill_name": "政策与服务指引",
  "answer": "可查询高龄津贴、长护险、社区居家养老服务、助餐补贴、适老化改造等政策。请补充所在城市、老人年龄、户籍和失能情况，我可以继续整理申请条件和办理材料。",
  "policy_items": [
    { "icon": "1", "label": "补贴类", "detail": "高龄津贴、护理补贴、困难老人补助等，与年龄、户籍、经济状况、能力评估相关。" },
    { "icon": "2", "label": "服务类", "detail": "社区居家养老、助餐送餐、上门护理、适老化改造、养老机构推荐等。" },
    { "icon": "3", "label": "办理类", "detail": "可继续询问申请条件、办理材料、办理地点和流程，我会按当地政策口径整理。" }
  ],
  "foot": "以上为一般性政策整理，具体标准以当地民政、人社部门最新规定为准。"
}
</script>
</body>
</html>
