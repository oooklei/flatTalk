<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>拒接订单</title>
  <link rel="stylesheet" href="_design_tokens.css" />
  <link rel="stylesheet" href="_card_components.css" />
</head>
<body>
  <!-- 语义：拒接订单原因选择。列出可选拒接原因，确认拒接由追问按钮体现。 -->
  <article class="nb-card" data-layout="vertical">
    <header class="nb-hero">
      <div class="eyebrow">派单处理</div>
      <h1>拒接订单</h1>
      <p class="subtitle">订单 {{order_no}} · {{service_name}}</p>
    </header>

    <section class="nb-section">
      <div style="font-size:14px;color:var(--muted);margin-bottom:10px">请选择拒接原因：</div>
      <div class="reject-reasons">
        {{#reasons}}<span class="reject-reason">{{.}}</span>{{/reasons}}
      </div>
    </section>

    <div class="foot">派单管理 · 拒接订单 · 桂颐政务</div>
  </article>

  <script type="application/json">
  {
    "order_no": "GD1234567890",
    "service_name": "上门护理",
    "reasons": ["人员不足，无法安排", "服务地址超出范围", "时间与已有订单冲突", "服务能力不匹配", "其他原因"]
  }
  </script>
</body>
</html>
