<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>服务工单</title>
  <style>
    :root { --primary:#2C7BE5; --grad:linear-gradient(135deg,#2C7BE5 0%,#5AA0F2 100%); --bg:#EEF4FE; --card:#fff; --ink:#2E3A49; --muted:#8A98AA; --border:#DCE7F7; }
    * { box-sizing:border-box; }
    body { margin:0; padding:14px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .card { max-width:420px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .hero { padding:16px; background:var(--grad); color:#fff; }
    h1 { margin:0; font-size:18px; }
    .tag { display:inline-block; margin-top:8px; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,0.22); font-size:12px; }
    .section { padding:12px 14px; border-top:1px solid var(--border); }
    .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px; }
    .row:last-child { border-bottom:none; }
    .row .k { color:var(--muted); }
    .row .v { font-weight:600; text-align:right; max-width:64%; }
    .link { margin-top:10px; padding:10px; border-radius:10px; background:#EAF2FE; color:var(--primary); font-size:12px; line-height:1.5; }
  </style>
</head>
<body>
  <article class="card" data-layout="vertical">
    <header class="hero"><h1>服务工单</h1><span class="tag">{{orderId}}</span></header>
    <section class="section">
      <div class="row"><span class="k">服务对象</span><span class="v">{{elderName}}</span></div>
      <div class="row"><span class="k">服务项目</span><span class="v">{{serviceName}}</span></div>
      <div class="row"><span class="k">服务机构</span><span class="v">{{orgName}}</span></div>
      <div class="row"><span class="k">状态</span><span class="v">{{status}}</span></div>
      <div class="row"><span class="k">期望时间</span><span class="v">{{expectedTime}}</span></div>
      <div class="link">关联派单：{{linkedDispatch}}</div>
    </section>
  </article>
  <script type="application/json">
  {
    "orderId": "so_1001",
    "elderName": "黄秀英",
    "serviceName": "上门护理",
    "orgName": "青秀社区居家养老服务中心",
    "status": "待派单",
    "expectedTime": "2026-07-31 10:00",
    "linkedDispatch": "dp_2001"
  }
  </script>
</body>
</html>
