<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>/* dispatch_manage · VI 令牌（政务端桂颐：霁蓝主色 + 暖橙点缀） */
:root{
  --primary:#3A6B8C;
  --primary-dark:#1E4A66;
  --grad:linear-gradient(135deg,#3A6B8C 0%,#1E4A66 100%);
  --bg:#FAF8F5;
  --card:#fff;
  --ink:#3D3A36;
  --muted:#8A8278;
  --line:#E4E0D8;
  --danger:#E5484D;
  --accent:#E8843C;
  --shadow:0 4px 18px rgba(62,56,50,.08);
  --radius:16px;

  --text-primary:#3D3A36;
  --text-secondary:#8A8278;
  --fs-body:15px;
  --fs-section:15px;
  --fs-form-label:14px;
}
*{box-sizing:border-box;}
body{margin:0;padding:14px;font-size:16px;line-height:1.55;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;}
.nb-card{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.nb-hero{padding:16px;background:var(--grad);color:#fff;}
.nb-hero .eyebrow{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22);font-size:12px;margin-bottom:8px;}
.nb-hero h1{margin:0;font-size:19px;}
.nb-hero .subtitle{margin:8px 0 0;font-size:13px;opacity:.92;line-height:1.45;}
.nb-section{padding:12px 14px;border-top:1px solid var(--line);}

/* dispatch_manage 派单组件样式 —— 忠实复刻 v4 原型供应商派单页 DOM，配色改用蓝色令牌 */
:root, .gxy-html-fallback {
  --ink: #3D3A36;
  --muted: #8A8278;
  --line: #E4E0D8;
  --primary: #3A6B8C;
  --primary-dark: #1E4A66;
  --danger: #E5484D;
  --grad: linear-gradient(135deg, #3A6B8C 0%, #1E4A66 100%);
}
.supplier-order-card{background:#fff;border:1px solid var(--line,#E4E0D8);border-radius:14px;padding:12px 13px;max-width:420px;margin:0 auto;color:var(--ink,#3D3A36);}
.supplier-order-card h3{margin:0 0 10px;font-size:15px;color:var(--ink,#3D3A36);}
.supplier-order-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);}
.supplier-order-row:last-child{border-bottom:none;}
.supplier-order-label{color:var(--muted);}
.supplier-order-value{color:var(--ink);font-weight:600;text-align:right;}
.veto-tip{font-size:14px;font-weight:600;color:var(--ink);margin:16px 0 6px;}
.veto-desc{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
.supplier-action-btns{display:flex;gap:10px;}
.supplier-action-btns button{flex:1;border-radius:10px;padding:12px;font-size:14px;font-weight:600;}
.btn-reject{border:1px solid var(--line);background:#fff;color:var(--danger);}
.btn-transfer{border:1px solid var(--primary);background:#fff;color:var(--primary);}
.btn-accept{border:none;background:var(--grad);color:#fff;}
.reject-reasons{display:flex;flex-wrap:wrap;gap:8px;}
.reject-reason{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#fff;font-size:13px;color:var(--ink);}
.transfer-list{display:flex;flex-direction:column;gap:10px;}
.transfer-item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;}
.transfer-item-name{font-size:14px;font-weight:700;color:var(--ink);}
.transfer-item-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.order-submit{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:var(--grad);color:#fff;}

/* —— 接单确认卡（新增业务场景，复用蓝色令牌） —— */
.accept-banner{display:flex;align-items:center;gap:10px;background:var(--grad);color:#fff;padding:14px;border-radius:12px;}
.accept-banner .ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.accept-banner .t{font-size:15px;font-weight:700;}
.accept-banner .s{font-size:12px;opacity:.9;}
.accept-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);}
.accept-row:last-child{border-bottom:none;}
.accept-row .k{color:var(--muted);}
.accept-row .v{font-weight:600;text-align:right;max-width:64%;}
.accept-eta{margin-top:10px;padding:10px;border-radius:10px;background:#E8F0F5;border:1px solid var(--line);font-size:13px;color:var(--primary-dark);text-align:center;font-weight:600;}
.foot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:right;background:#fff;}


.tc-deck{box-sizing:border-box;}
.tc-deck[data-layout="horizontal"]{display:flex;flex-direction:row;flex-wrap:nowrap;gap:16px;overflow-x:auto;padding:8px 0;}
.tc-deck[data-layout="vertical"]{display:flex;flex-direction:column;gap:16px;}
.tc-card{flex:0 0 auto;}
.tc-pager{margin-top:12px;font:13px/1.4 system-ui,sans-serif;color:#666;}

.tc-followups{box-sizing:border-box;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.tc-followups-label{font:13px/1.4 system-ui,sans-serif;color:#8a8a8a;margin-right:2px;}
.tc-followup-btn{appearance:none;cursor:pointer;font:13px/1.3 system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:1px solid var(--primary,#2c7be5);background:#fff;color:var(--primary,#2c7be5);transition:.15s;}
.tc-followup-btn:hover{background:var(--primary,#2c7be5);color:#fff;}
</style>
</head>
<body>
<div class="tc-deck" data-layout="vertical"><div class="tc-card">
  <!-- 语义：将订单转交其他供应商。列出可转交对象(名称+空闲率/环境/人数)，确认转交由追问按钮体现。 -->
  <article class="nb-card" data-layout="vertical">
    <header class="nb-hero">
      <div class="eyebrow">派单处理</div>
      <h1>转交订单</h1>
      <p class="subtitle">订单 GD1234567890 · 上门护理</p>
    </header>

    <section class="nb-section">
      <div style="font-size:14px;color:var(--muted);margin-bottom:10px">请选择转交对象：</div>
      <div class="transfer-list">
        
        <div class="transfer-item">
          <div class="transfer-item-info">
            <div class="transfer-item-name">桂林乐颐家政服务公司</div>
            <div class="transfer-item-meta">空闲率92% | 环境4.2分 | 45人</div>
          </div>
        </div>
        
        <div class="transfer-item">
          <div class="transfer-item-info">
            <div class="transfer-item-name">秀峰区爱心护理站</div>
            <div class="transfer-item-meta">空闲率78% | 环境4.8分 | 15人</div>
          </div>
        </div>
        
        <div class="transfer-item">
          <div class="transfer-item-info">
            <div class="transfer-item-name">桂林康乐养老服务有限公司</div>
            <div class="transfer-item-meta">空闲率88% | 环境4.5分 | 32人</div>
          </div>
        </div>
        
      </div>
    </section>

    <div class="foot">派单管理 · 转交订单 · 桂颐政务</div>
  </article>

  
</div></div>


<script>window.__MAP_KEY__="KI4BZ-5GGLT-POOXY-LQK77-6XA62-YVFPH";</script><script id="card-bridge-script">/**
 * Card Interaction Bridge — injected into card iframe for universal button dispatch
 */
(function () {
  if (window.__cardBridgeInitialized) return;
  window.__cardBridgeInitialized = true;

  function telHrefToPhone(href) {
    return String(href || '').replace(/^tel:/i, '').split(/[?#]/)[0].trim();
  }

  function handleClick(e) {
    var btn = e.target.closest('[data-action-key]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();

    var payload = {
      type: 'flattalk_card_action',
      action_key: btn.getAttribute('data-action-key') || '',
      action_type: btn.getAttribute('data-action-type') || 'dispatch',
      user_prompt: btn.getAttribute('data-user-prompt') || '',
      skill_key: btn.getAttribute('data-skill-key') || '',
      params: {},
    };

    var paramsStr = btn.getAttribute('data-params');
    if (paramsStr) {
      try { payload.params = JSON.parse(paramsStr); } catch {}
    }

    if (payload.action_type === 'form_submit') {
      var form = btn.closest('form');
      if (form) {
        var formData = new FormData(form);
        var data = {};
        formData.forEach(function (val, key) { data[key] = val; });
        payload.params.form_data = data;
      }
    }

    window.parent.postMessage(payload, '*');
  }

  document.addEventListener('click', handleClick, true);

  document.addEventListener('click', function (e) {
    var telLink = e.target.closest('a[href^="tel:"]');
    if (!telLink) return;
    e.preventDefault();
    e.stopPropagation();
    var href = telLink.getAttribute('href') || '';
    window.parent.postMessage({
      type: 'flattalk_phone_dial',
      phone: telHrefToPhone(href),
      href: href,
      label: (telLink.textContent || '').trim(),
    }, '*');
  }, true);

  document.addEventListener('click', function (e) {
    var mapLink = e.target.closest('[data-action-type="external_map"]');
    if (!mapLink) return;
    e.preventDefault();
    e.stopPropagation();
    var url = mapLink.getAttribute('data-href') || mapLink.getAttribute('href') || '';

    // 已有 TMap 实例的卡片：直接复用
    if (typeof TMap !== 'undefined' && window.__nbMapInstance) {
      var params0 = mapLink.getAttribute('data-params');
      if (params0) {
        try {
          var poi0 = JSON.parse(params0);
          if (poi0.lat && poi0.lng) {
            showInCardRoute(window.__nbMapInstance, poi0);
            return;
          }
        } catch {}
      }
    }

    // 无 TMap 实例：在按钮下方动态展开迷你地图
    var poi = null;
    var paramsStr = mapLink.getAttribute('data-params');
    if (paramsStr) {
      try { poi = JSON.parse(paramsStr); } catch {}
    }

    var container = mapLink.parentElement;
    var existing = container.querySelector('.nb-mini-map');
    if (existing) { existing.remove(); return; } // 再次点击收起

    if (poi && poi.lat && poi.lng) {
      // 动态加载 TMap SDK + 迷你地图
      showMiniMap(container, poi, url);
    } else {
      // 无坐标：只能新窗口打开 URI API
      window.parent.postMessage({ type: 'flattalk_open_map', url: url }, '*');
    }
  }, true);

  /**
   * 在卡片内动态展开迷你地图（按需加载 TMap SDK）
   */
  function showMiniMap(container, poi, fallbackUrl) {
    var wrap = document.createElement('div');
    wrap.className = 'nb-mini-map';
    wrap.style.cssText = 'width:100%;height:240px;border:1px solid #e0e0e0;border-radius:8px;margin-top:8px;position:relative;overflow:hidden;';
    var canvas = document.createElement('div');
    canvas.style.cssText = 'width:100%;height:100%;';
    wrap.appendChild(canvas);

    // 底部按钮栏：在新窗口打开完整导航
    var bar = document.createElement('div');
    bar.style.cssText = 'padding:6px 8px;background:#f5f5f5;border-top:1px solid #e0e0e0;display:flex;gap:8px;justify-content:flex-end;';
    var openBtn = document.createElement('button');
    openBtn.textContent = '打开完整导航 →';
    openBtn.style.cssText = 'background:#2f6f4e;color:#fff;border:none;padding:4px 12px;border-radius:4px;font-size:13px;cursor:pointer;';
    openBtn.onclick = function (ev) {
      ev.stopPropagation();
      window.parent.postMessage({ type: 'flattalk_open_map', url: fallbackUrl }, '*');
    };
    bar.appendChild(openBtn);
    wrap.appendChild(bar);

    container.appendChild(wrap);

    // 从模板变量获取地图 Key（注入在 window.__MAP_KEY__）
    var key = window.__MAP_KEY__ || '';
    if (!key) {
      canvas.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:13px;">地图加载失败（缺少Key）</div>';
      return;
    }

    // 动态加载 TMap SDK（竞态保护：避免与模板自身的加载器冲突）
    if (typeof TMap === 'undefined') {
      // 如果已有加载请求在进行中，挂载回调而非二次加载
      if (window.__tmapLoadingQueue) {
        window.__tmapLoadingQueue.push(function () { initMiniMap(canvas, poi); });
      } else {
        window.__tmapLoadingQueue = [function () { initMiniMap(canvas, poi); }];
        var script = document.createElement('script');
        // 不带 visualization：部分 Key 未开通该库会整页 GLJS 加载失败
        script.src = 'https://map.qq.com/api/gljs?v=1.exp&key=' + key;
        script.onload = function () {
          var queue = window.__tmapLoadingQueue || [];
          window.__tmapLoadingQueue = null;
          queue.forEach(function (cb) { try { cb(); } catch {} });
        };
        script.onerror = function () {
          window.__tmapLoadingQueue = null;
          canvas.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:13px;">地图加载失败</div>';
        };
        document.head.appendChild(script);
      }
    } else {
      initMiniMap(canvas, poi);
    }
  }

  function initMiniMap(canvas, poi) {
    try {
      var map = new TMap.Map(canvas, {
        center: new TMap.LatLng(poi.lat, poi.lng),
        zoom: 14,
        baseMap: { type: 'vector', features: ['base', 'label'] },
      });
      // 目的地标记
      new TMap.MultiMarker({
        map: map,
        geometries: [{
          id: 'dest',
          position: new TMap.LatLng(poi.lat, poi.lng),
        }],
      });
      // 信息窗
      new TMap.InfoWindow({
        map: map,
        position: new TMap.LatLng(poi.lat, poi.lng),
        content: '<div style="padding:4px 8px;font-size:13px;">' + (poi.name || '目的地') + '</div>',
      });
    } catch {
      canvas.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:13px;">地图渲染失败</div>';
    }
  }

  function showInCardRoute(map, poi) {
    try {
      map.setCenter(new TMap.LatLng(poi.lat, poi.lng));
      map.setZoom(15);
      var info = new TMap.InfoWindow({
        map: map,
        position: new TMap.LatLng(poi.lat, poi.lng),
        content: '<div style="padding:4px 8px;font-size:13px;">' + (poi.name || '目的地') + '</div>'
      });
    } catch {
      // TMap 操作失败，忽略
    }
  }
})();
</script></body>
</html>
