<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>服务订单状态</title>
  <style>
    :root { --primary:#E8843C; --grad:linear-gradient(135deg,#E8843C 0%,#F0B487 100%); --bg:#FDF6F0; --card:#fff; --ink:#3D3A36; --muted:#8A9A93; --border:#E4E0D8; }
    * { box-sizing:border-box; }
    body { margin:0; padding:14px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .card { max-width:420px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .hero { padding:16px; background:var(--grad); color:#fff; }
    h1 { margin:0; font-size:18px; }
    .subtitle { margin:6px 0 0; font-size:13px; opacity:.92; }
    .section { padding:12px 14px; border-top:1px solid var(--border); }
    .o { display:flex; justify-content:space-between; align-items:center; padding:10px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:#FAFFFD; }
    .o .left .nm { font-size:13px; font-weight:600; }
    .o .left .el { font-size:11px; color:var(--muted); }
    .o .st { font-size:12px; font-weight:700; color:var(--primary); }
  </style>
</head>
<body>
  <article class="card" data-layout="vertical">
    <header class="hero"><h1>我的服务订单</h1><p class="subtitle">共 {{total}} 条</p></header>
    <section class="section">
      {{#orders}}
      <div class="o">
        <div class="left"><div class="nm">{{serviceName}}</div><div class="el">{{orderId}} · {{elderName}} · {{expectedTime}}</div></div>
        <div class="st">{{status}}</div>
      </div>
      {{/orders}}
    </section>
  </article>
  <script type="application/json">
  {
    "total": 3,
    "orders": [
      { "orderId": "so_1001", "elderName": "黄秀英", "serviceName": "上门护理", "status": "待派单", "expectedTime": "2026-07-31 10:00" },
      { "orderId": "so_1002", "elderName": "李德明", "serviceName": "陪诊就医", "status": "已派单", "expectedTime": "2026-07-30 14:30" }
    ]
  }
  </script>
</body>
</html>
