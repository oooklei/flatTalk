<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>{{pageTitle}}</title>
<style>
:root{
  --primary:#E8843C; --primary-deep:#D06E2A; --primary-soft:#FDF6F0;
  --accent:#3A6B8C; --accent-soft:#E8F0F5; --accent-deep:#1E4A66;
  --ok:#6B9B7A; --ok-soft:#E8F2EC; --ok-deep:#3D6B4D;
  --warn:#D4A537; --warn-soft:#FBF3DD; --warn-deep:#9C7715;
  --n0:#FAF8F5; --n50:#F0EDE7; --n100:#E4E0D8; --n200:#D9D4CC; --n300:#C4BEB4;
  --n400:#A8A09A; --n500:#8A8278; --n600:#6B6660; --n700:#4A463F; --n800:#3D3A36;
  --font-serif:'Noto Serif SC','Songti SC','STSong',serif;
  --font-sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:999px;
  --sh-md:0 4px 12px rgba(62,56,50,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);background:var(--n0);color:var(--n800);
  font-size:16px;line-height:1.6;padding:12px;
  overflow-wrap:anywhere;word-break:break-word;-webkit-font-smoothing:antialiased;
}
img{max-width:100%;height:auto;display:block}
a{color:var(--primary);text-decoration:none}

.card{
  max-width:430px;width:100%;margin:0 auto;background:#fff;border:1px solid var(--n100);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-md);
}

.hero{
  padding:16px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-deep));
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-full);
  background:rgba(255,255,255,.18);font-size:12px;font-weight:600;
}
.hero h1{font-family:var(--font-serif);margin:8px 0 0;font-size:22px;line-height:1.18;letter-spacing:.5px}
.hero .sub{margin-top:6px;color:rgba(255,255,255,.88);font-size:13px}

.section{padding:13px 14px;border-top:1px solid var(--n100)}
.section-title{
  margin:0 0 10px;display:flex;align-items:center;gap:7px;color:var(--n800);
  font-size:15px;font-weight:800;font-family:var(--font-serif);
}
.section-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--primary)}

.date-card{
  padding:16px;background:var(--primary-soft);border:1px solid #F5CDAE;border-radius:var(--r-md);text-align:center;
}
.date-label{font-size:13px;color:var(--n500);margin-bottom:6px}
.date-value{
  font-family:var(--font-serif);font-size:28px;font-weight:800;color:var(--primary-deep);line-height:1.2;
  overflow-wrap:anywhere;word-break:break-word;
}
.date-recommend{
  display:inline-block;margin-top:8px;padding:3px 10px;border-radius:var(--r-full);
  background:var(--primary);color:#fff;font-size:12px;font-weight:600;
}

.hint{
  padding:10px;border-radius:var(--r-md);background:var(--accent-soft);border:1px solid #D1E3ED;
  color:var(--accent-deep);font-size:13px;line-height:1.5;
  overflow-wrap:anywhere;word-break:break-word;
}

.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0}
.row + .row{border-top:1px dashed var(--n100)}
.row .k{color:var(--n500);flex:0 0 auto;font-size:13px}
.row .v{font-weight:700;text-align:right;min-width:0;font-size:13px;overflow-wrap:anywhere;word-break:break-word}

.action{padding:12px 14px;border-top:1px solid var(--n100)}
.btn-row{display:flex;gap:10px}
.btn{
  flex:1;min-height:46px;border-radius:var(--r-md);border:none;
  font-size:15px;font-weight:700;letter-spacing:1px;font-family:var(--font-sans);
  display:flex;align-items:center;justify-content:center;
}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff}
.btn-ghost{background:#fff;color:var(--primary-deep);border:1.5px solid var(--primary)}

.foot{padding:10px 14px;border-top:1px solid var(--n100);color:var(--n400);font-size:11px;text-align:center}

@media (max-width:360px){
  body{padding:10px} .hero h1{font-size:20px} .date-value{font-size:24px}
}
</style>
</head>
<body>
<div class="card" data-template="service_booking_confirm" data-layout="vertical">

  <div class="hero">
    <div class="eyebrow">📅 {{cardEyebrow}}</div>
    <h1>{{serviceName}}</h1>
    <p class="sub">{{heroSub}}</p>
  </div>

  <div class="section">
    <div class="section-title">📆 预约日期</div>
    <div class="date-card">
      <div class="date-label">{{dateLabel}}</div>
      <div class="date-value">{{dateDisplay}}</div>
      <div class="date-recommend">{{recommendTag}}</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">ℹ 预约信息</div>
    <div class="row"><span class="k">服务项目</span><span class="v">{{serviceName}}</span></div>
    <div class="row"><span class="k">预约日期</span><span class="v">{{dateValue}}</span></div>
    <div class="row"><span class="k">推荐来源</span><span class="v">{{recommendTag}}</span></div>
  </div>

  <div class="section">
    <div class="section-title">💬 智能提示</div>
    <div class="hint">{{hintText}}</div>
  </div>

  <div class="action">
    <div class="btn-row">
      <a class="btn btn-primary" href="#">{{confirmBtnText}}</a>
      <a class="btn btn-ghost" href="#">{{modifyBtnText}}</a>
    </div>
  </div>

  <div class="foot">来源：{{footSource}}</div>
</div>
<script type="application/json">
{
  "pageTitle": "预约确认",
  "cardEyebrow": "预约确认",
  "serviceName": "居家深度清洁",
  "heroSub": "AI 已为您推荐最优服务时间",
  "dateLabel": "预约日期",
  "dateDisplay": "明天（8月11日）",
  "recommendTag": "AI智能推荐",
  "dateValue": "2026-08-11",
  "hintText": "您可以说\"好的\"确认，或告诉我其他日期，如\"后天\"、\"下周三\"。",
  "confirmBtnText": "确认",
  "modifyBtnText": "修改",
  "footSource": "AI预约确认",
  "id": "booking_confirm_001",
  "template": "service-booking-confirm"
}
</script>
</body>
</html>
