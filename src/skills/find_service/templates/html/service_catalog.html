<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>养老服务目录</title>
  <style>
    :root { --primary:#E8843C; --grad:linear-gradient(135deg,#E8843C 0%,#F0B487 100%); --bg:#FDF6F0; --card:#fff; --ink:#3D3A36; --muted:#8A9A93; --border:#E4E0D8; }
    * { box-sizing:border-box; }
    body { margin:0; padding:14px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .card { max-width:420px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .hero { padding:16px; background:var(--grad); color:#fff; }
    h1 { margin:0; font-size:19px; }
    .subtitle { margin:6px 0 0; font-size:13px; opacity:.92; }
    /* 标签页导航 */
    .tabs { display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; background:#F5FBF8; border-bottom:2px solid var(--border); }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; appearance:none; border:0; background:transparent; padding:12px 16px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-2px; transition:.2s; }
    .tab.active { color:var(--primary); border-bottom-color:var(--primary); background:#fff; }
    /* 标签页面板 */
    .tab-panel { display:none; padding:12px 14px; }
    .tab-panel.active { display:block; }
    .panel-count { font-size:11px; color:var(--muted); margin-bottom:8px; }
    /* 服务项 */
    .item { display:flex; justify-content:space-between; align-items:center; padding:9px 10px; border:1px solid var(--border); border-radius:10px; margin-bottom:7px; background:#FAFFFD; }
    .item:last-child { margin-bottom:0; }
    .item .nm { font-size:13px; font-weight:600; }
    .item .meta { font-size:11px; color:var(--muted); }
    .item .pr { color:var(--primary); font-weight:700; font-size:13px; white-space:nowrap; }
  </style>
</head>
<body>
  <article class="card" data-layout="vertical">
    <header class="hero">
      <h1>{{sceneTitle}}</h1>
      <p class="subtitle">共 {{total}} 项可预约服务</p>
    </header>
    <nav class="tabs">
    {{#categories}}
      <button type="button" class="tab">{{category}}</button>
    {{/categories}}
    </nav>
    {{#categories}}
    <section class="tab-panel">
      <p class="panel-count">{{category}} · 共 {{items.length}} 项</p>
      {{#items}}
      <div class="item">
        <div><div class="nm">{{name}}</div><div class="meta">{{tags}}</div></div>
        <div class="pr">{{price}}/{{unit}}</div>
      </div>
      {{/items}}
    </section>
    {{/categories}}
  </article>
  <script>
    (function(){
      var tabs=document.querySelectorAll('.tab');
      var panels=document.querySelectorAll('.tab-panel');
      if(!tabs.length||!panels.length)return;
      tabs[0].classList.add('active');
      panels[0].classList.add('active');
      tabs.forEach(function(tab,i){
        tab.addEventListener('click',function(){
          tabs.forEach(function(t){t.classList.remove('active');});
          panels.forEach(function(p){p.classList.remove('active');});
          tab.classList.add('active');
          if(panels[i])panels[i].classList.add('active');
        });
      });
    })();
  </script>
