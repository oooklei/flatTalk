<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>紧急求助</title>
  <link rel="stylesheet" href="_design_tokens.css" />
  <link rel="stylesheet" href="_card_components.css" />
  <style>
    .emergency-alert { max-width: 480px; margin: 0 auto; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px rgba(229,72,77,.25); }
    .emergency-alert-header { background: linear-gradient(135deg, #E5484D, #c93a3f); color: #fff; padding: 20px 16px; display: flex; align-items: center; gap: 12px; }
    .emergency-alert-header svg { width: 32px; height: 32px; fill: #fff; flex: none; animation: sos-pulse 1.2s ease-in-out infinite; }
    @keyframes sos-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .emergency-alert-header span { font-size: 17px; font-weight: 700; }
    .emergency-alert-body { padding: 18px 16px; background: #fff; }
    .emergency-alert-body p { margin: 0 0 12px; font-size: 15px; line-height: 1.6; color: #1a1a1a; }
    .emergency-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .sos-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: transform .12s; }
    .sos-btn:active { transform: scale(.97); }
    .sos-btn-call { background: #E5484D; color: #fff; }
    .sos-btn-family { background: #0E7C86; color: #fff; }
    .sos-btn-safe { background: #f0f5f6; color: #0E7C86; border: 1px solid #cfe3e5; }
    .sos-note { font-size: 12px; color: #9AA7B2; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <!-- 语义：SOS 应急卡。检测到紧急情况时展示，提供一键拨打120和通知家属按钮。 -->
  <article class="emergency-alert" data-layout="vertical">
    <div class="emergency-alert-header">
      <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <span>检测到紧急情况</span>
    </div>
    <div class="emergency-alert-body">
      <p>检测到您可能遇到紧急状况（{{matched_keywords}}）。请保持冷静，立即采取行动：</p>
      <div class="emergency-actions">
        <a class="sos-btn sos-btn-call" href="tel:120">📞 立即拨打 120</a>
        <a class="sos-btn sos-btn-family" href="tel:{{emergency_phone}}">👪 通知家属（{{emergency_name}}）</a>
        <button class="sos-btn sos-btn-safe" onclick="this.innerText='✓ 已标记安全';this.style.background='#e8f5e9';this.style.color='#2e7d32'">✓ 我已安全</button>
      </div>
      <p class="sos-note">点击按钮直接拨号。如无法说话，保持电话畅通，120可定位。</p>
    </div>
  </article>

  <script type="application/json">
  {
    "matched_keywords": "紧急关键词",
    "emergency_phone": "",
    "emergency_name": "家属"
  }
  </script>
</body>
</html>
