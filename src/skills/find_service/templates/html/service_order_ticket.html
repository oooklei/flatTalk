<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>{{pageTitle}}</title>
<style>
:root{
  --primary:#E8843C; --primary-deep:#D06E2A;
  --ok:#6B9B7A; --ok-soft:#E8F2EC; --ok-deep:#3D6B4D;
  --warn:#D4A537;
  --n0:#FAF8F5; --n50:#F0EDE7; --n100:#E4E0D8;
  --n400:#A8A09A; --n500:#8A8278; --n600:#6B6660; --n700:#4A463F; --n800:#3D3A36;
  --font-serif:'Noto Serif SC','Songti SC','STSong',serif;
  --font-sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --r-md:10px; --r-lg:16px; --r-full:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);background:var(--n0);color:var(--n800);
  font-size:16px;line-height:1.6;padding:14px;
  overflow-wrap:anywhere;word-break:break-word;-webkit-font-smoothing:antialiased;
}
.card{
  max-width:430px;width:100%;margin:0 auto;background:#fff;border:1px solid var(--n100);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:0 4px 12px rgba(62,56,50,.10);
}
.success-head{
  display:flex;flex-direction:column;align-items:center;padding:22px 14px 8px;
}
.success-icon{
  width:56px;height:56px;border-radius:var(--r-full);
  background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;
}
.success-title{
  margin-top:12px;font-family:var(--font-serif);font-size:22px;font-weight:800;color:var(--n800);letter-spacing:1px;
}
.rows{padding:10px 14px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0}
.row + .row{border-top:1px solid var(--n100)}
.row .k{color:var(--n500);font-size:14px;flex:0 0 auto}
.row .v{font-weight:700;text-align:right;font-size:14px;min-width:0}
.row .v.status{color:var(--warn)}
.foot{padding:10px 14px;border-top:1px solid var(--n100);color:var(--n400);font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="card" data-template="service_order_ticket" data-layout="vertical">
  <div class="success-head">
    <div class="success-icon">✓</div>
    <h1 class="success-title">{{cardTitle}}</h1>
  </div>
  <div class="rows">
    <div class="row"><span class="k">订单编号</span><span class="v">{{orderNo}}</span></div>
    <div class="row"><span class="k">服务名称</span><span class="v">{{serviceName}}</span></div>
    <div class="row"><span class="k">预约日期</span><span class="v">{{dateDisplay}}</span></div>
    <div class="row"><span class="k">服务时段</span><span class="v">{{timeSlot}}</span></div>
    <div class="row"><span class="k">归属机构</span><span class="v">{{institution}}</span></div>
    <div class="row"><span class="k">状态</span><span class="v status">{{status}}</span></div>
  </div>
  <div class="foot">来源：{{footSource}}</div>
</div>
</body>
</html>
