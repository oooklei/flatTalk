<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    .emergency-alert { max-width: 480px; margin: 0 auto; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px rgba(229,72,77,.25); }
    .emergency-alert-header { background: linear-gradient(135deg, #E5484D, #c93a3f); color: #fff; padding: 20px 16px; display: flex; align-items: center; gap: 12px; }
    .emergency-alert-header svg { width: 32px; height: 32px; fill: #fff; flex: none; animation: sos-pulse 1.2s ease-in-out infinite; }
    @keyframes sos-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .emergency-alert-header span { font-size: 17px; font-weight: 700; }
    .emergency-alert-body { padding: 18px 16px; background: #fff; }
    .emergency-alert-body p { margin: 0 0 12px; font-size: 15px; line-height: 1.6; color: #1a1a1a; }
    .emergency-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .sos-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: transform .12s; }
    .sos-btn:active { transform: scale(.97); }
    .sos-btn-call { background: #E5484D; color: #fff; }
    .sos-btn-family { background: #E8843C; color: #fff; }
    .sos-btn-safe { background: #f0f5f6; color: #E8843C; border: 1px solid #cfe3e5; }
    .sos-note { font-size: 12px; color: #9AA7B2; margin-top: 12px; text-align: center; }
  
/* find_service · VI 令牌（C端桂小养：暖橙） */
:root{
  --primary:#E8843C;
  --primary-dark:#D06E2A;
  --grad:linear-gradient(135deg,#E8843C 0%,#D06E2A 100%);
  --bg:#FAF8F5;
  --card:#fff;
  --ink:#3D3A36;
  --muted:#8A8278;
  --line:#E4E0D8;
  --danger:#E5484D;
  --warn:#D4A537;
  --radius:16px;
  --shadow:0 4px 18px rgba(62,56,50,.08);

  --text-primary:#3D3A36;
  --text-secondary:#8A8278;
  --fs-body:15px;
  --fs-section:15px;
  --fs-form-label:14px;

  --o50:#FDF6F0; --o100:#FAE6D5; --b100:#E8F0F5; --g100:#E8F2EC;
}
*{box-sizing:border-box;}
body{
  margin:0;padding:14px;font-size:16px;line-height:1.55;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;
}
.nb-card{
  max-width:420px;margin:0 auto;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
}
.nb-hero{padding:16px;background:var(--grad);color:#fff;}
.nb-hero .eyebrow{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22);font-size:12px;margin-bottom:8px;}
.nb-hero h1{margin:0;font-size:19px;}
.nb-hero .subtitle{margin:8px 0 0;font-size:13px;opacity:.92;line-height:1.45;}
.nb-section{padding:12px 14px;border-top:1px solid var(--line);}
.nb-section h2{margin:0 0 8px;font-size:14px;color:var(--ink);}
.nb-chip{display:inline-block;padding:3px 9px;border-radius:999px;background:#FDF6F0;color:#D06E2A;font-size:11px;margin:0 4px 4px 0;}

/* find_service 对话卡片组件样式 —— 忠实复刻 v4 原型卡片 DOM 结构与元素，配色改用令牌 */
:root, .gxy-html-fallback {
  --ink: #3D3A36;
  --muted: #8A8278;
  --line: #E4E0D8;
  --primary: #E8843C;
  --primary-dark: #D06E2A;
  --warn: #C47D16;
  --danger: #E5484D;
  --grad: linear-gradient(135deg, #E8843C 0%, #D06E2A 100%);
}
/* 1) 意图识别卡 */
.ai-result-card{background:#fff;border:1px solid var(--line,#E4E0D8);border-radius:14px;padding:12px 13px;margin:0 auto;max-width:420px;color:var(--ink,#3D3A36);}
.ai-result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ai-result-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;}
.ai-result-badge.service{background:#FDF6F0;color:#D06E2A;}
.ai-result-badge.sos{background:#FDECEC;color:#E5484D;}
.ai-result-badge.health{background:#E8F0F5;color:#3A6B8C;}
.ai-result-badge.chat{background:#EEF0F2;color:#8A8278;}
.ai-result-confidence{font-size:12px;color:var(--muted);}
.ai-result-confidence .score{font-weight:700;color:var(--primary);}
.ai-result-confidence .score.low{color:var(--warn);}
.ai-result-section{margin-top:8px;}
.ai-result-section-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.ai-result-entities{display:flex;flex-wrap:wrap;gap:6px;}
.ai-result-entity{background:#FDF6F0;color:var(--ink);font-size:12px;padding:4px 9px;border-radius:8px;}
.ai-result-entity .entity-type{color:var(--muted);margin-right:2px;}
/* 2) 紧急求助卡 */
.emergency-alert{border-radius:14px;overflow:hidden;max-width:420px;margin:0 auto;border:1px solid #F3C9C9;background:#FFF;}
.emergency-alert-header{display:flex;align-items:center;gap:8px;background:var(--danger);color:#fff;padding:11px 13px;font-size:14px;font-weight:600;}
.emergency-alert-header svg{width:18px;height:18px;fill:#fff;}
.emergency-alert-body{padding:12px 13px;font-size:14px;color:#7a3b3b;background:#FDECEC;line-height:1.6;}
.emergency-alert-actions{display:flex;gap:10px;padding:12px 13px;}
.btn-emergency-primary{flex:1;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;background:var(--danger);color:#fff;}
.btn-emergency-secondary{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;font-weight:600;background:#fff;color:var(--muted);}
/* 3) 思考卡 */
.thinking-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;max-width:420px;margin:0 auto;}
.thinking-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:12px;}
.thinking-steps{display:flex;flex-direction:column;gap:12px;}
.thinking-step{display:flex;align-items:center;gap:10px;opacity:.45;transition:.3s;}
.thinking-step.active{opacity:1;}
.step-icon{width:26px;height:26px;border-radius:50%;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;}
.thinking-step.active .step-icon{background:var(--primary);}
.step-text{font-size:14px;font-weight:600;color:var(--ink);}
.step-detail{font-size:12px;color:var(--muted);}
/* 4) 推荐标签栏 + 服务卡 + 拓展卡 + 猜你喜欢 */
.recommend-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;}
.recommend-tab{flex:none;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;white-space:nowrap;}
.recommend-tab.active{background:var(--grad);color:#fff;border-color:transparent;}
.service-list{display:flex;flex-direction:column;gap:10px;}
.service-card,.expand-card{display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;align-items:stretch;}
.service-card.is-clickable{cursor:pointer;transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;}
.service-card.is-clickable:hover,.service-card.is-clickable:focus{border-color:#F0B27A;box-shadow:0 2px 10px rgba(232,132,60,.14);outline:none;}
.service-card.is-clickable:active{transform:scale(.995);}
.card-thumb{width:62px;height:62px;border-radius:12px;background:linear-gradient(135deg,#D8F3EA,#B7E9D8);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.card-title{font-size:15px;font-weight:700;color:var(--ink);}
.card-meta{font-size:12px;color:var(--muted);line-height:1.5;margin:3px 0;}
.supplier-info{font-size:12px;color:#5B6B64;margin:2px 0 6px;}
.card-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px;}
.card-price{color:var(--primary);font-weight:700;font-size:16px;}
.card-price .unit{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px;}
.card-cta{flex:none;font-size:12px;font-weight:600;color:var(--primary);}
.btn-book-sm{border:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;background:var(--grad);color:#fff;}
.expand-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;margin-bottom:5px;}
.expand-badge.availability{background:#FDF6F0;color:#D06E2A;}
.expand-badge.environment{background:#E8F0F5;color:#3A6B8C;}
.expand-badge.response{background:#FFF1E6;color:#E0833A;}
.guess-like-section{margin-top:16px;}
.guess-like-header{margin-bottom:10px;}
.guess-like-title{font-size:15px;font-weight:700;color:var(--ink);}
.guess-like-subtitle{font-size:12px;color:var(--muted);}
.guess-like-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.guess-like-card{flex:none;width:170px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.gl-image{height:84px;position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;}
.gl-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.35);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px;}
.gl-info{padding:9px 10px;}
.gl-name{font-size:14px;font-weight:700;color:var(--ink);}
.gl-summary{font-size:12px;color:var(--muted);line-height:1.45;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.gl-price{font-size:14px;font-weight:700;color:var(--primary);}
.gl-provider{font-size:11px;color:var(--muted);margin-top:3px;}
/* 5) 服务详情 */
.detail-section{padding:12px 14px;border-top:1px solid var(--line);}
.detail-section h3{margin:0 0 7px;font-size:14px;color:var(--ink);}
.detail-section p{margin:0;font-size:13px;color:#5B6B64;line-height:1.6;}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:#FDF6F0;color:#D06E2A;font-size:12px;padding:4px 10px;border-radius:8px;}
.detail-features{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.detail-feature{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);}
.detail-feature .check{width:18px;height:18px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none;}
.detail-feature .check svg{width:12px;height:12px;fill:#fff;}
/* 6) 下单表单（展示态）+ 凭证 */
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.form-group .required{color:var(--danger);}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;background:#FAFFFD;color:var(--ink);}
.form-group textarea{min-height:64px;resize:vertical;}
.field-source{font-size:11px;color:var(--primary);margin-top:4px;}
.time-recommendations{display:flex;flex-direction:column;gap:8px;}
.time-recommendation{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#FAFFFD;}
.time-recommendation.selected{border-color:var(--primary);background:#FDF6F0;}
.time-slot{font-size:14px;font-weight:600;color:var(--ink);}
.time-reason{font-size:11px;color:var(--muted);}
.time-check{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.time-recommendation.selected .time-check{background:var(--primary);border-color:transparent;}
.time-check svg{width:12px;height:12px;fill:#fff;}
.order-submit{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:var(--grad);color:#fff;}
.ticket-view{text-align:center;padding:18px 14px;}
.ticket-icon{width:52px;height:52px;border-radius:50%;background:var(--grad);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;}
.ticket-icon svg{width:28px;height:28px;fill:#fff;}
.ticket-view h3{margin:0 0 6px;font-size:18px;color:var(--ink);}
.ticket-view>p{margin:0 0 14px;font-size:13px;color:var(--muted);}
.ticket-card{background:#FDF6F0;border-radius:12px;padding:12px;text-align:left;}
.ticket-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);}
.ticket-row:last-child{border-bottom:none;}
.ticket-label{color:var(--muted);}
.ticket-value{color:var(--ink);font-weight:600;}
.status-badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:#FFF1E6;color:#E0833A;}
.status-badge.done{background:#FDF6F0;color:#D06E2A;}

/* —— 服务追溯卡 / 服务口碑卡（新增业务场景，复用令牌） —— */
.trace-meta{margin-top:4px;}
.trace-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);}
.trace-row:last-child{border-bottom:none;}
.trace-row .k{color:var(--muted);}
.trace-row .v{font-weight:600;text-align:right;}
.trace-list{position:relative;margin-top:6px;padding-left:18px;}
.trace-list::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line);}
.trace-item{position:relative;padding:7px 0;}
.trace-item::before{content:"";position:absolute;left:-16px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px #FDF6F0;}
.trace-item.bad::before{background:var(--danger);box-shadow:0 0 0 3px #FDECEC;}
.trace-item .t{font-size:11px;color:var(--muted);}
.trace-item .n{font-size:13px;font-weight:600;color:var(--ink);}
.trace-item .d{font-size:12px;color:var(--muted);}
.trace-item .d.ok{color:var(--primary);}
.review-summary{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
.review-summary .score{font-size:26px;font-weight:800;color:var(--primary);}
.review-summary .level{font-size:13px;color:var(--muted);}
.review-dims{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px;}
.review-dim{display:flex;align-items:center;gap:8px;font-size:12px;}
.review-dim .dn{width:104px;color:var(--muted);flex:none;}
.review-dim .bar{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden;}
.review-dim .bar>span{display:block;height:100%;background:var(--grad);}
.review-dim .dv{width:44px;text-align:right;font-weight:600;color:var(--ink);}
.review-item{padding:8px 0;border-top:1px dashed var(--line);font-size:13px;}
.review-item .who{font-weight:600;color:var(--ink);}
.review-item .txt{color:var(--muted);margin-top:2px;line-height:1.5;}
.review-complaint{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:#FFF1E6;color:#E0833A;font-size:12px;}
.foot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:right;background:#fff;}


.tc-deck{box-sizing:border-box;}
.tc-deck[data-layout="horizontal"]{display:flex;flex-direction:row;flex-wrap:nowrap;gap:16px;overflow-x:auto;padding:8px 0;}
.tc-deck[data-layout="vertical"]{display:flex;flex-direction:column;gap:16px;}
.tc-card{flex:0 0 auto;}
.tc-pager{margin-top:12px;font:13px/1.4 system-ui,sans-serif;color:#666;}

.tc-followups{box-sizing:border-box;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.tc-followups-label{font:13px/1.4 system-ui,sans-serif;color:#8a8a8a;margin-right:2px;}
.tc-followup-btn{appearance:none;cursor:pointer;font:13px/1.3 system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:1px solid var(--primary,#2c7be5);background:#fff;color:var(--primary,#2c7be5);transition:.15s;}
.tc-followup-btn:hover{background:var(--primary,#2c7be5);color:#fff;}
</style>
</head>
<body>
<div class="tc-deck" data-layout="vertical"><div class="tc-card">
  <!-- 语义：SOS 应急卡。检测到紧急情况时展示，提供一键拨打120和通知家属按钮。 -->
  <article class="emergency-alert" data-layout="vertical">
    <div class="emergency-alert-header">
      <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <span>检测到紧急情况</span>
    </div>
    <div class="emergency-alert-body">
      <p>检测到您可能遇到紧急状况（跌倒、无法起身）。请保持冷静，立即采取行动：</p>
      <div class="emergency-actions">
        <a class="sos-btn sos-btn-call" href="tel:120">📞 立即拨打 120</a>
        <a class="sos-btn sos-btn-family" href="tel:13877981234">👪 通知家属（张明（儿子））</a>
        <button class="sos-btn sos-btn-safe action-btn" data-action-key="find_service.sos_mark_safe" data-action-type="dispatch" data-skill-key="find_service" data-user-prompt="我已经安全了，取消紧急求助">✓ 我已安全</button>
      </div>
      <p class="sos-note">点击按钮直接拨号。如无法说话，保持电话畅通，120可定位。</p>
    </div>
  </article>

  
</div></div>

  }, true);

  /**
   * 在卡片内动态展开迷你地图（按需加载 TMap SDK）
   */
  function showMiniMap(container, poi, fallbackUrl) {
    var wrap = document.createElement('div');
    wrap.className = 'nb-mini-map';
    wrap.style.cssText = 'width:100%;height:240px;border:1px solid #e0e0e0;border-radius:8px;margin-top:8px;position:relative;overflow:hidden;';
    var canvas = document.createElement('div');
    canvas.style.cssText = 'width:100%;height:100%;';
    wrap.appendChild(canvas);

    // 底部按钮栏：在新窗口打开完整导航
    var bar = document.createElement('div');
    bar.style.cssText = 'padding:6px 8px;background:#f5f5f5;border-top:1px solid #e0e0e0;display:flex;gap:8px;justify-content:flex-end;';
    var openBtn = document.createElement('button');
    openBtn.textContent = '打开完整导航 →';
    openBtn.style.cssText = 'background:#2f6f4e;color:#fff;border:none;padding:4px 12px;border-radius:4px;font-size:13px;cursor:pointer;';
    openBtn.onclick = function (ev) {
      ev.stopPropagation();
      window.parent.postMessage({ type: 'flattalk_open_map', url: fallbackUrl }, '*');
    };
    bar.appendChild(openBtn);
    wrap.appendChild(bar);

    container.appendChild(wrap);

    // 从模板变量获取地图 Key（注入在 window.__MAP_KEY__）
    var key = window.__MAP_KEY__ || '';
    if (!key) {
      canvas.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:13px;">地图加载失败（缺少Key）</div>';
      return;
    }

    // 动态加载 TMap SDK（竞态保护：避免与模板自身的加载器冲突）
    if (typeof TMap === 'undefined') {
      // 如果已有加载请求在进行中，挂载回调而非二次加载
      if (window.__tmapLoadingQueue) {
        window.__tmapLoadingQueue.push(function () { initMiniMap(canvas, poi); });
      } else {
        window.__tmapLoadingQueue = [function () { initMiniMap(canvas, poi); }];
        var script = document.createElement('script');
        // 不带 visualization：部分 Key 未开通该库会整页 GLJS 加载失败
        script.src = 'https://map.qq.com/api/gljs?v=1.exp&key=' + key;
        script.onload = function () {
          var queue = window.__tmapLoadingQueue || [];
          window.__tmapLoadingQueue = null;
          queue.forEach(function (cb) { try { cb(); } catch {} });
        };
        script.onerror = function () {
          window.__tmapLoadingQueue = null;
          canvas.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:13px;">地图加载失败</div>';
        };
        document.head.appendChild(script);
      }
    } else {
      initMiniMap(canvas, poi);
    }
  }

  function initMiniMap(canvas, poi) {
    try {
      var map = new TMap.Map(canvas, {
        center: new TMap.LatLng(poi.lat, poi.lng),
        zoom: 14,
        baseMap: { type: 'vector', features: ['base', 'label'] },
      });
      // 目的地标记
      new TMap.MultiMarker({
        map: map,
        geometries: [{
          id: 'dest',
          position: new TMap.LatLng(poi.lat, poi.lng),
        }],
      });
      // 信息窗
      new TMap.InfoWindow({
        map: map,
        position: new TMap.LatLng(poi.lat, poi.lng),
        content: '<div style="padding:4px 8px;font-size:13px;">' + (poi.name || '目的地') + '</div>',
      });
    } catch {
      canvas.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:13px;">地图渲染失败</div>';
    }
  }

  function showInCardRoute(map, poi) {
    try {
      map.setCenter(new TMap.LatLng(poi.lat, poi.lng));
      map.setZoom(15);
      var info = new TMap.InfoWindow({
        map: map,
        position: new TMap.LatLng(poi.lat, poi.lng),
        content: '<div style="padding:4px 8px;font-size:13px;">' + (poi.name || '目的地') + '</div>'
      });
    } catch {
      // TMap 操作失败，忽略
    }
  }
})();
</script></body>
