<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>膳食调养</title>
  <style>
    :root {
      --blue: #4a90d9;
      --blue-title: #2d7ec4;
      --blue-line: #c5daf0;
      --red-border: #e07a7a;
      --text: #333;
      --text-strong: #222;
      --bg: #f5f8fc;
      --card: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 24px 16px 48px;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(74, 144, 217, 0.08);
      padding: 24px 28px 36px;
    }

    .section-badge {
      display: inline-block;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 36px 8px 18px;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
      margin-bottom: 18px;
    }

    .diet-summary {
      border: 1px solid var(--red-border);
      background: #fbfbfb;
      border-radius: 2px;
      padding: 14px 16px;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text);
    }

    .diet-summary p + p {
      margin-top: 10px;
    }

    .diet-summary strong {
      color: var(--text-strong);
      font-weight: 700;
    }

    .recipe-list {
      list-style: none;
    }

    .recipe-item {
      display: flex;
      gap: 18px;
      padding: 22px 0;
      border-bottom: 1px dashed var(--blue-line);
      align-items: flex-start;
    }

    .recipe-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .recipe-thumb {
      flex-shrink: 0;
      width: 110px;
      height: 110px;
      border-radius: 4px;
      overflow: hidden;
      background: #eef5fb;
    }

    .recipe-thumb img,
    .recipe-thumb svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .recipe-body {
      flex: 1;
      min-width: 0;
      font-size: 14px;
    }

    .recipe-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--blue-title);
      margin-bottom: 8px;
    }

    .recipe-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .recipe-meta p {
      color: var(--text);
    }

    .recipe-meta strong {
      color: var(--text-strong);
      font-weight: 700;
    }

    /* tc-deck 支持样式 */
    .tc-deck { box-sizing: border-box; }
    .tc-deck[data-layout="horizontal"] { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 16px; overflow-x: auto; padding: 8px 0; }
    .tc-deck[data-layout="vertical"] { display: flex; flex-direction: column; gap: 16px; }
    .tc-card { flex: 0 0 auto; }

    @media (max-width: 640px) {
      .page { padding: 18px 14px 28px; }
      .recipe-item { flex-direction: column; gap: 12px; }
      .recipe-thumb { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>
  <div class="tc-deck" data-layout="vertical">
    <div class="tc-card">
      <div class="page">
        <div class="section-badge">{{sectionBadge|膳食调养}}</div>

        <div class="diet-summary">
          <p><strong>【宜食】</strong>{{dietaryAdvice}}</p>
          <p><strong>【忌食】</strong>{{dietaryAvoid}}</p>
        </div>

        <ul class="recipe-list">
          {{#recipes}}
          <li class="recipe-item">
            <div class="recipe-thumb" aria-hidden="true">
              {{{recipeThumb}}}
            </div>
            <div class="recipe-body">
              <h3 class="recipe-title">{{recipeTitle}}</h3>
              <div class="recipe-meta">
                <p><strong>【药材】</strong>{{recipeMedicine}}</p>
                <p><strong>【食材】</strong>{{recipeIngredients}}</p>
                <p><strong>【烹饪方法】</strong>{{recipeMethod}}</p>
                <p><strong>【功效】</strong>{{recipeEffect}}</p>
                <p><strong>【引自】</strong>{{recipeSource}}</p>
              </div>
            </div>
          </li>
          {{/recipes}}
        </ul>
      </div>
    </div>
  </div>

</body>
</html>
