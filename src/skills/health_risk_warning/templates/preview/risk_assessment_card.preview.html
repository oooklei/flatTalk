<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>风险评估卡片预览</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    background: #f5f8fc;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .container { width: 100%; max-width: 860px; }
</style>
</head>
<body>
<div class="container">
  <div style="background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(74,144,217,0.08); padding: 28px 28px 36px;">
    <h1 style="text-align: center; font-size: 26px; font-weight: 700; color: #4a90d9; letter-spacing: 2px; margin-bottom: 12px;">风险评估</h1>
    <div style="height: 1px; background: #4a90d9; margin-bottom: 20px;"></div>
    <div style="display: inline-block; background: #4a90d9; color: #fff; font-size: 16px; font-weight: 600; padding: 8px 36px 8px 18px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); margin-bottom: 16px;">易患病症</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; background: #ebf4fb; border-radius: 2px; padding: 12px 8px; margin-bottom: 8px;">
      <span style="text-align: center; font-size: 15px; font-weight: 700;">重度风险 (1项)</span>
      <span style="text-align: center; font-size: 15px; font-weight: 700;">中度风险 (6项)</span>
      <span style="text-align: center; font-size: 15px; font-weight: 700;">轻度风险 (6项)</span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; padding: 8px 4px 0;">
      <div style="display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid #f0f4f8; font-size: 14px;">
        <span>乳腺结节风险评估</span>
        <span style="font-weight: 600; min-width: 40px; text-align: right; color: #e54d42;">65.6</span>
        <span style="font-weight: 600; min-width: 64px; text-align: right; color: #e54d42;">预警</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid #f0f4f8; font-size: 14px;">
        <span>骨质疏松症风险评估</span>
        <span style="font-weight: 600; min-width: 40px; text-align: right; color: #e8a020;">54.5</span>
        <span style="font-weight: 600; min-width: 64px; text-align: right; color: #e8a020;">中度风险</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid #f0f4f8; font-size: 14px;">
        <span>甲状腺结节风险评估</span>
        <span style="font-weight: 600; min-width: 40px; text-align: right; color: #e8a020;">55.8</span>
        <span style="font-weight: 600; min-width: 64px; text-align: right; color: #e8a020;">中度风险</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid #f0f4f8; font-size: 14px;">
        <span>中风风险评估</span>
        <span style="font-weight: 600; min-width: 40px; text-align: right; color: #68b032;">38.3</span>
        <span style="font-weight: 600; min-width: 64px; text-align: right; color: #68b032;">轻度风险</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
