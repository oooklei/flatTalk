<!doctype html>
<html lang="zh-CN" data-template="nearby_compare" data-layout="compare">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>嘉路康养生活圈 · 同类对比</title>
  <link rel="stylesheet" href="_design_tokens.css">
  <link rel="stylesheet" href="_base.css">
  <style>
    :root{--primary:#E8843C;--primary-weak:#FDF6F0;--accent:#E8843C;--accent-weak:#FAE6D5;--card:#fff;--card-2:#FDF6F0;--bg:#FAF8F5;--ink:#3D3A36;--ink-2:#6B6660;--muted:#8A8278;--border:#E4E0D8;--line:#E4E0D8;--wellness:#E5484D;--radius:16px;--radius-sm:12px;--shadow:0 4px 18px rgba(62,56,50,.08);--shadow-sm:0 2px 8px rgba(62,56,50,.08);--tap:44px;}
  </style>
</head>
<body>
  <div class="nb-wrap">
    <section class="nb-card">
      <div class="nb-head">
        <div>
          <h2 class="nb-title">⚖️ 同类资源对比</h2>
          <p class="nb-sub">{{centerName}} 周边 {{categoryLabel}} · 精选 Top3 并排比较</p>
        </div>
        <span class="nb-badge">周边配套</span>
      </div>
      <div class="nb-cmp">
        {{#picks}}
        <div class="nb-cmp-col">
          <div class="nb-cmp-name">{{emoji}} {{name}}</div>
          <div class="nb-cmp-row"><span>距离</span><b>{{distance_text}}km</b></div>
          <div class="nb-cmp-row"><span>状态</span><b>{{biz_status}}</b></div>
          {{#tags}}<div class="nb-tags" style="margin-top:8px">{{#tags}}<span class="nb-tag">{{.}}</span>{{/tags}}</div>{{/tags}}
          <div class="nb-row-actions" style="margin-top:10px">
            <button class="nb-btn nb-btn-primary action-btn" data-action-type="external_map" data-params='{{{nav_params}}}' data-href="https://apis.map.qq.com/uri/v1/routeplan?type=walk&from=coord:{{centerLat}},{{centerLng}};title:{{centerName}}&to=coord:{{lat}},{{lng}};title:{{name}}&policy=1&referer=KI4BZ-5GGLT-POOXY-LQK77-6XA62-YVFPH">🧭 导航</button>
            {{#tel}}<a class="nb-btn" href="tel:{{tel}}">☎</a>{{/tel}}
          </div>
        </div>
        {{/picks}}
        {{^picks}}<div class="nb-empty">暂无可供对比的同类资源</div>{{/picks}}
      </div>
    </section>
  </div>
</body>
</html>
