<!doctype html>
<html lang="zh-CN" data-template="nearby_map_category" data-layout="map">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>嘉路康养生活圈 · 单类资源分布</title>
  <link rel="stylesheet" href="./_design_tokens.css" />
  <link rel="stylesheet" href="./_base.css" />
  <style>
    .nb-card { max-width: 760px; margin: 0 auto; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .nb-head { padding: 14px 16px; display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, #0B5C63 100%); color: #fff; }
    .nb-head .pin { width: 30px; height: 30px; flex: none; border-radius: 9px; background: rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .nb-head h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .nb-head .src { margin-left: auto; font-size: 11px; opacity: .85; background: rgba(255,255,255,.16); padding: 3px 8px; border-radius: 999px; }
    .nb-sub { padding: 8px 16px; font-size: 12.5px; color: var(--muted); background: var(--card-2); border-bottom: 1px solid var(--line); }
    .nb-filters { padding: 10px 16px 0; }
    .nb-map { position: relative; min-height: 420px; background: #eef2f7; }
    #mapCanvas { width: 100%; height: 430px; display: block; }
    .nb-svg-fallback { display: none; width: 100%; height: 430px; }
    .nb-svg-fallback.show { display: block; }
    .nb-static-img { display: none; width: 100%; height: 430px; object-fit: cover; }
    .nb-static-img.show { display: block; }
    .nb-list { max-height: 420px; overflow-y: auto; padding: 10px 12px 14px; }
    .nb-item { border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
    .nb-item .nm { font-size: 13.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
    .nb-item .km { color: var(--primary); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
    .nb-item .addr { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .nb-item .meta { font-size: 11.5px; color: var(--ink-2); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
    .nav-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    .nb-empty { padding: 30px; text-align: center; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <article class="nb-card">
    <header class="nb-head">
      <div class="pin">🗺️</div>
      <h1>{{centerName}} · {{categoryLabel}} 分布图</h1>
      <div class="src">本地知识库</div>
    </header>
    <div class="nb-sub">已按「{{categoryLabel}}」筛选，半径 {{radiusKm}} 公里内共 <b>{{total}}</b> 个配套，下方可切换查看其他类别。</div>

    <div class="nb-filters">
      <div class="nb-chip" data-cat="all"><span class="nb-emoji">📍</span>全部</div>
      <div class="nb-chip" data-cat="stay"><span class="nb-emoji">🏠</span>住</div>
      <div class="nb-chip" data-cat="food"><span class="nb-emoji">🍜</span>吃</div>
      <div class="nb-chip" data-cat="spot"><span class="nb-emoji">🏖️</span>游</div>
      <div class="nb-chip" data-cat="leisure"><span class="nb-emoji">🎣</span>娱</div>
      <div class="nb-chip" data-cat="shop"><span class="nb-emoji">🛍️</span>购</div>
      <div class="nb-chip" data-cat="transit"><span class="nb-emoji">🚐</span>行</div>
      <div class="nb-chip" data-cat="wellness"><span class="nb-emoji">🏥</span>养</div>
    </div>

    <div class="nb-map">
      <div id="mapCanvas"></div>
      <img class="nb-static-img" id="staticMapImg" alt="地图预览" />
      <svg class="nb-svg-fallback" id="svgFallback" viewBox="0 0 400 430" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="nb-list" id="listBox"></div>
  </article>

  <script id="nearby-data" type="application/json">{{{markers_json}}}</script>
  <script id="nearby-center" type="application/json">{{{center_json}}}</script>

  <script>
    (function () {
      var SAMPLE = [
        { poi_id:'s3', name:'西湾滨海景区', address:'西湾大道', lng:108.150, lat:21.540, distance:2.5, cat:'spot', color:'#2BAE8E', emoji:'🏖️', biz_status:'开放中', tel:'', open_time:'全天', tags:['海景','日落'], tags_text:'海景·日落' },
        { poi_id:'s3b', name:'怪石滩景区', address:'江山半岛', lng:108.140, lat:21.545, distance:4.1, cat:'spot', color:'#2BAE8E', emoji:'🏖️', biz_status:'开放中', tel:'', open_time:'全天', tags:['礁石','赶海'], tags_text:'礁石·赶海' },
        { poi_id:'s3c', name:'白浪滩', address:'防城港北仑河口', lng:108.130, lat:21.552, distance:6.3, cat:'spot', color:'#2BAE8E', emoji:'🏖️', biz_status:'开放中', tel:'', open_time:'全天', tags:['沙滩'], tags_text:'沙滩' }
      ];
      var PAYLOAD = [];
      try { PAYLOAD = JSON.parse(document.getElementById('nearby-data').textContent); } catch (e) {}
      if (!PAYLOAD || !PAYLOAD.length) PAYLOAD = SAMPLE;
      var CENTER = { lng: {{centerLng}}, lat: {{centerLat}}, name: '{{centerName}}' };
      try { var c = JSON.parse(document.getElementById('nearby-center').textContent); if (c && c.lat) CENTER = c; } catch (e) {}
      var RADIUS = parseInt('{{radiusKm}}' || '15', 10) || 15;
      var MAP_KEY = '{{map_key}}';
      var SVG_FALLBACK = (!MAP_KEY || MAP_KEY === 'YOUR_TENCENT_JS_KEY');
      var STATIC_MAP_URL = '{{{static_map_url}}}';
      var mapLoadTimer = null;
      var activeCat = '{{category}}' || 'all';
      var map = null, markers = [];

      function navUrl(p){ return 'https://apis.map.qq.com/uri/v1/routeplan?type=walk&from=coord:' + CENTER.lat + ',' + CENTER.lng + ';title:' + encodeURIComponent(CENTER.name || '当前位置') + '&to=coord:' + p.lat + ',' + p.lng + ';title:' + encodeURIComponent(p.name) + '&policy=1&referer=KI4BZ-5GGLT-POOXY-LQK77-6XA62-YVFPH'; }
      function renderList() {
        var box = document.getElementById('listBox');
        var items = PAYLOAD.filter(function (p) { return activeCat === 'all' || p.cat === activeCat; });
        if (!items.length) { box.innerHTML = '<div class="nb-empty">该分类下暂无周边资源</div>'; return; }
        box.innerHTML = items.map(function (p) {
          var st = p.biz_status ? ('<span>' + p.biz_status + '</span>') : '';
          var op = p.open_time ? ('<span>⏰ ' + p.open_time + '</span>') : '';
          var tg = p.tags_text ? ('<span style="color:var(--primary)">🏷 ' + p.tags_text + '</span>') : '';
          var tel = p.tel ? ('<span>☎ ' + p.tel + '</span>') : '';
          return '<div class="nb-item" style="border-left-color:' + (p.color || '#9AA7B2') + '">' +
            '<div class="nm"><span>' + (p.emoji || '📍') + ' ' + (p.name || '未命名') + '</span><span class="km">' + (parseFloat(p.distance) || 0).toFixed(1) + 'km</span></div>' +
            '<div class="addr">' + (p.address || '地址未知') + '</div>' +
            '<div class="meta">' + st + op + tg + tel + '<a class="nav-link action-btn" data-action-type="external_map" data-href="' + navUrl(p) + '" data-params=\'' + JSON.stringify({lat:p.lat,lng:p.lng,name:p.name}) + '\'>🧭 导航</a></div>' +
            '</div>';
        }).join('');
      }
      function applyMarkerVisibility() { if (!map) return; PAYLOAD.forEach(function (p, i) { var vis = (activeCat === 'all' || p.cat === activeCat); if (markers[i]) markers[i].setMap(vis ? map : null); }); }
      function bearing(a, b) { return ((Math.atan2(b.lng - a.lng, b.lat - a.lat) * 180 / Math.PI) + 360) % 360; }
      function renderSVG() {
        var svg = document.getElementById('svgFallback'); svg.classList.add('show');
        var img = document.getElementById('staticMapImg'); if (img) img.classList.remove('show');
        document.getElementById('mapCanvas').style.display = 'none';
        var cx = 200, cy = 215, R = 175, html = '';
        html += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="#cbd5e1" stroke-dasharray="4 4"/>';
        html += '<circle cx="' + cx + '" cy="' + cy + '" r="7" fill="#0E7C86"/>';
        html += '<text x="' + cx + '" y="' + (cy - 14) + '" text-anchor="middle" font-size="11" fill="#0E7C86" font-weight="600">' + (CENTER.name || '中心') + '</text>';
        PAYLOAD.forEach(function (p) { if (activeCat !== 'all' && p.cat !== activeCat) return; var d = parseFloat(p.distance) || 0, rr = Math.min(R, (d / RADIUS) * R), ang = (p._bearing || 0) * Math.PI / 180; var x = cx + rr * Math.sin(ang), y = cy - rr * Math.cos(ang); html += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="' + (p.color || '#9AA7B2') + '"/>'; });
        svg.innerHTML = html;
      }
      function showStaticMap() {
        var img = document.getElementById('staticMapImg');
        if (STATIC_MAP_URL && img) {
          img.onerror = function () { img.classList.remove('show'); renderSVG(); };
          img.onload = function () { document.getElementById('mapCanvas').style.display = 'none'; document.getElementById('svgFallback').classList.remove('show'); };
          img.src = STATIC_MAP_URL;
          img.classList.add('show');
        } else { renderSVG(); }
      }
      function init() {
        document.querySelectorAll('.nb-chip').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-cat') === activeCat); });
        PAYLOAD.forEach(function (p, i) { p._bearing = bearing(CENTER, p); p.cat = p.cat || 'other'; });
        renderList();
        document.querySelectorAll('.nb-chip').forEach(function (c) { c.addEventListener('click', function () { document.querySelectorAll('.nb-chip').forEach(function (x) { x.classList.remove('active'); }); c.classList.add('active'); activeCat = c.getAttribute('data-cat'); renderList(); applyMarkerVisibility(); }); });
        renderSVG();
        if (SVG_FALLBACK) { renderSVG(); return; }
        mapLoadTimer = setTimeout(function () {
          if (typeof TMap === 'undefined') { console.warn('[地图] 加载超时，降级到静态图'); showStaticMap(); }
        }, 3000);
        if (typeof TMap === 'undefined' && !window.__nbLoading) {
          window.__nbLoading = true;
          var s = document.createElement('script');
          s.src = 'https://map.qq.com/api/gljs?v=1.exp&key=' + encodeURIComponent(MAP_KEY) + '&libraries=visualization';
          s.onerror = function () { clearTimeout(mapLoadTimer); showStaticMap(); };
          s.onload = function () { clearTimeout(mapLoadTimer); try { buildMap(); } catch (e) { showStaticMap(); } };
          document.head.appendChild(s);
        }
      }
      function buildMap() {
        if (typeof TMap === 'undefined') { showStaticMap(); return; }
        document.getElementById('staticMapImg').classList.remove('show');
        document.getElementById('svgFallback').classList.remove('show');
        document.getElementById('mapCanvas').style.display = 'block';
        map = new TMap.Map(document.getElementById('mapCanvas'), { center: new TMap.LatLng(CENTER.lat, CENTER.lng), zoom: 10 });
        setTimeout(function () {
          var canvas = document.querySelector('#mapCanvas canvas, #mapCanvas img');
          if (!canvas || (canvas.width < 2 && canvas.height < 2)) {
            console.warn('[地图] 瓦片加载失败，降级到静态图'); showStaticMap();
          }
        }, 4000);
        new TMap.MultiPolygon({ map: map, geometries: [{ id: 'radius', styleId: 'radius', paths: (function () { var pts = [], n = 64; for (var i = 0; i < n; i++) { var t = i / n * Math.PI * 2; var lat = CENTER.lat + (RADIUS / 111) * Math.cos(t); var lng = CENTER.lng + (RADIUS / (111 * Math.cos(CENTER.lat * Math.PI / 180))) * Math.sin(t); pts.push(new TMap.LatLng(lat, lng)); } return pts; })() }], styles: { radius: new TMap.PolygonStyle({ strokeColor: '#0E7C86', strokeWidth: 2, fillColor: '#0E7C8622' }) } });
        PAYLOAD.forEach(function (p, i) {
          var markerId = 'm' + i;
          var markerStyles = {};
          markerStyles[markerId] = new TMap.MarkerStyle({ width: 20, height: 20, src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="8" fill="' + (p.color || '#9AA7B2') + '" stroke="#fff" stroke-width="2"/></svg>') });
          var m = new TMap.MultiMarker({ map: map, geometries: [{ id: markerId, position: new TMap.LatLng(p.lat, p.lng), properties: { idx: i } }], styles: markerStyles });
          m.on('click', function () { map.setCenter(new TMap.LatLng(p.lat, p.lng)); });
          markers[i] = m;
        });
        applyMarkerVisibility();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
  </script>
</body>
</html>
