<!doctype html>
<html lang="zh-CN" data-template="nearby_radar" data-layout="map">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>嘉路康养生活圈 · 可达性雷达</title>
  <link rel="stylesheet" href="./_design_tokens.css" />
  <link rel="stylesheet" href="./_base.css" />
  <style>
    .nb-card { max-width: 760px; margin: 0 auto; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .nb-head { padding: 14px 16px; display: flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, #0B5C63 100%); color: #fff; }
    .nb-head .pin { width: 30px; height: 30px; flex: none; border-radius: 9px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .nb-head h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .nb-head .src { margin-left: auto; font-size: 11px; opacity: .85; background: rgba(255,255,255,.16); padding: 3px 8px; border-radius: 999px; }
    .nb-sub { padding: 9px 16px; font-size: 12.5px; color: var(--ink-2); background: var(--card-2); border-bottom: 1px solid var(--line); }
    .nb-body { display: grid; grid-template-columns: 1.1fr 1fr; }
    @media (max-width: 620px) { .nb-body { grid-template-columns: 1fr; } }
    .nb-map { position: relative; min-height: 430px; background: #eef2f7; }
    #mapCanvas { width: 100%; height: 430px; display: block; }
    .nb-svg-fallback { display: none; width: 100%; height: 430px; }
    .nb-svg-fallback.show { display: block; }
    .nb-static-img { display: none; width: 100%; height: 430px; object-fit: cover; }
    .nb-static-img.show { display: block; }
    .nb-rings { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.9); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 11px; color: var(--ink-2); }
    .nb-rings b { color: var(--spot); }
    .nb-list { max-height: 460px; overflow-y: auto; padding: 12px; border-left: 1px solid var(--border); }
    @media (max-width: 620px) { .nb-list { border-left: 0; border-top: 1px solid var(--border); max-height: 320px; } }
    .nb-item { border: 1px solid var(--border); border-left: 4px solid var(--spot); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
    .nb-item .nm { font-size: 13.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
    .nb-item .km { color: var(--spot); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
    .nb-item .addr { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .nb-item .meta { font-size: 11.5px; color: var(--ink-2); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
    .nav-link { color: var(--primary); text-decoration: none; font-weight: 600; }
    .nb-empty { padding: 30px; text-align: center; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <article class="nb-card">
    <header class="nb-head">
      <div class="pin">📡</div>
      <h1>{{centerName}} · 可达性雷达</h1>
      <div class="src">本地知识库</div>
    </header>
    <div class="nb-sub">在 {{radiusKm}} 公里生活圈内，步行 1.5km 范围内可达 <b style="color:var(--spot)">{{walkCount}}</b> 个配套；其余建议包车 / 自驾前往。</div>
    <div class="nb-body">
      <div class="nb-map">
        <div id="mapCanvas"></div>
      <img class="nb-static-img" id="staticMapImg" alt="地图预览" />
      <svg class="nb-svg-fallback" id="svgFallback" viewBox="0 0 400 430" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="nb-rings">🟢 步行圈 1.5km · <b>车行圈 {{radiusKm}}km</b></div>
      </div>
      <div class="nb-list" id="listBox"></div>
    </div>
  </article>

  <script id="nearby-walk" type="application/json">{{{walkItems_json}}}</script>
  <script id="nearby-center" type="application/json">{{{center_json}}}</script>

  <script>
    (function () {
      var SAMPLE = [
        { poi_id:'s1', name:'海岸假日民宿', address:'某路12号', lng:108.172, lat:21.531, distance:0.8, cat:'stay', color:'#3B82A0', emoji:'🏠', biz_status:'营业中', tel:'0770-1234567', open_time:'24小时', tags:['近海'], tags_text:'近海' },
        { poi_id:'s2', name:'渔家海鲜大排档', address:'渔洲坪', lng:108.160, lat:21.524, distance:1.2, cat:'food', color:'#F2994A', emoji:'🍜', biz_status:'营业中', tel:'0770-2233445', open_time:'11:00-22:00', tags:['私房菜'], tags_text:'私房菜' },
        { poi_id:'s5', name:'海特产购物店', address:'某路', lng:108.164, lat:21.528, distance:1.6, cat:'shop', color:'#E08AC0', emoji:'🛍️', biz_status:'营业中', tel:'', open_time:'09:00-21:00', tags:['特产'], tags_text:'特产' }
      ];
      var PAYLOAD = [];
      try { PAYLOAD = JSON.parse(document.getElementById('nearby-walk').textContent); } catch (e) {}
      if (!PAYLOAD || !PAYLOAD.length) PAYLOAD = SAMPLE;
      var CENTER = { lng: 108.166816, lat: 21.527905, name: '{{centerName}}' };
      try { var c = JSON.parse(document.getElementById('nearby-center').textContent); if (c && c.lat) CENTER = c; } catch (e) {}
      var RADIUS = parseInt('{{radiusKm}}' || '15', 10) || 15;
      var MAP_KEY = '{{map_key}}';
      var SVG_FALLBACK = (!MAP_KEY || MAP_KEY === 'YOUR_TENCENT_JS_KEY');
      var STATIC_MAP_URL = '{{{static_map_url}}}';
      var mapLoadTimer = null;
      var map = null;

      function navUrl(p){ return 'https://apis.map.qq.com/uri/v1/routeplan?type=walk&to=coord:' + p.lat + ',' + p.lng + ';title:' + encodeURIComponent(p.name) + '&referer=KI4BZ-5GGLT-POOXY-LQK77-6XA62-YVFPH'; }
      function renderList() {
        var box = document.getElementById('listBox');
        if (!PAYLOAD.length) { box.innerHTML = '<div class="nb-empty">1.5km 内暂无步行可达配套，建议查看车行资源</div>'; return; }
        box.innerHTML = PAYLOAD.map(function (p) {
          var st = p.biz_status ? ('<span>' + p.biz_status + '</span>') : '';
          var tg = p.tags_text ? ('<span style="color:var(--primary)">🏷 ' + p.tags_text + '</span>') : '';
          return '<div class="nb-item">' +
            '<div class="nm"><span>' + (p.emoji || '📍') + ' ' + (p.name || '未命名') + '</span><span class="km">' + (parseFloat(p.distance) || 0).toFixed(1) + 'km</span></div>' +
            '<div class="addr">' + (p.address || '地址未知') + '</div>' +
            '<div class="meta">' + st + tg + '<a class="nav-link action-btn" data-action-type="external_map" data-href="' + navUrl(p) + '">🧭 导航</a></div>' +
            '</div>';
        }).join('');
      }
      function circlePaths(cx, cy, R, n, lat0, lng0, rKm) {
        var pts = []; for (var i = 0; i < n; i++) { var t = i / n * Math.PI * 2; var lat = lat0 + (rKm / 111) * Math.cos(t); var lng = lng0 + (rKm / (111 * Math.cos(lat0 * Math.PI / 180))) * Math.sin(t); pts.push(new TMap.LatLng(lat, lng)); } return pts;
      }
      function renderSVG() {
        var svg = document.getElementById('svgFallback'); svg.classList.add('show');
        var img = document.getElementById('staticMapImg'); if (img) img.classList.remove('show');
        document.getElementById('mapCanvas').style.display = 'none';
        var cx = 200, cy = 215, R = 165, html = '';
        html += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * 1.5 / RADIUS) + '" fill="none" stroke="#cbd5e1" stroke-dasharray="5 4"/>';
        html += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * 1.5 / RADIUS * (1.5 / RADIUS) ) + '" fill="none" stroke="#2BAE8E" stroke-dasharray="3 4" opacity=".7"/>';
        html += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#0E7C86"/>';
        PAYLOAD.forEach(function (p) { var d = parseFloat(p.distance) || 0; var rr = Math.min(R, (d / RADIUS) * R); var ang = (parseFloat(p._b) || 0) * Math.PI / 180; var x = cx + rr * Math.sin(ang), y = cy - rr * Math.cos(ang); html += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="#2BAE8E"/>'; });
        svg.innerHTML = html;
      }
      function showStaticMap() {
        var img = document.getElementById('staticMapImg');
        if (STATIC_MAP_URL && img) {
          img.onerror = function () { img.classList.remove('show'); renderSVG(); };
          img.onload = function () { document.getElementById('mapCanvas').style.display = 'none'; document.getElementById('svgFallback').classList.remove('show'); };
          img.src = STATIC_MAP_URL;
          img.classList.add('show');
        } else { renderSVG(); }
      }
      function init() {
        renderList();
        PAYLOAD.forEach(function (p, i) { p._b = i * 47; });
        renderSVG();
        if (SVG_FALLBACK) { renderSVG(); return; }
        mapLoadTimer = setTimeout(function () {
          if (typeof TMap === 'undefined') { console.warn('[地图] 加载超时，降级到静态图'); showStaticMap(); }
        }, 3000);
        if (typeof TMap === 'undefined' && !window.__nbLoading) {
          window.__nbLoading = true;
          var s = document.createElement('script');
          s.src = 'https://map.qq.com/api/gljs?v=1.exp&key=' + encodeURIComponent(MAP_KEY) + '&libraries=visualization';
          s.onerror = function () { clearTimeout(mapLoadTimer); showStaticMap(); };
          s.onload = function () { clearTimeout(mapLoadTimer); try { buildMap(); } catch (e) { showStaticMap(); } };
          document.head.appendChild(s);
        }
      }
      function buildMap() {
        if (typeof TMap === 'undefined') { showStaticMap(); return; }
        document.getElementById('staticMapImg').classList.remove('show');
        document.getElementById('svgFallback').classList.remove('show');
        document.getElementById('mapCanvas').style.display = 'block';
        map = new TMap.Map(document.getElementById('mapCanvas'), { center: new TMap.LatLng(CENTER.lat, CENTER.lng), zoom: 12 });
        setTimeout(function () {
          var canvas = document.querySelector('#mapCanvas canvas, #mapCanvas img');
          if (!canvas || (canvas.width < 2 && canvas.height < 2)) {
            console.warn('[地图] 瓦片加载失败，降级到静态图'); showStaticMap();
          }
        }, 4000);
        new TMap.MultiPolygon({ map: map, geometries: [{ id: 'radius', styleId: 'radius', paths: circlePaths(0, 0, 0, 64, CENTER.lat, CENTER.lng, RADIUS) }], styles: { radius: new TMap.PolygonStyle({ strokeColor: '#cbd5e1', strokeWidth: 2, fillColor: '#0E7C8608' }) } });
        new TMap.MultiPolygon({ map: map, geometries: [{ id: 'walk', styleId: 'walk', paths: circlePaths(0, 0, 0, 48, CENTER.lat, CENTER.lng, 1.5) }], styles: { walk: new TMap.PolygonStyle({ strokeColor: '#2BAE8E', strokeWidth: 2, fillColor: '#2BAE8E18' }) } });
        PAYLOAD.forEach(function (p, i) {
          var markerId = 'w' + i;
          var markerStyles = {};
          markerStyles[markerId] = new TMap.MarkerStyle({ width: 18, height: 18, src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><circle cx="9" cy="9" r="7" fill="#2BAE8E" stroke="#fff" stroke-width="2"/></svg>') });
          new TMap.MultiMarker({ map: map, geometries: [{ id: markerId, position: new TMap.LatLng(p.lat, p.lng) }], styles: markerStyles });
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
  </script>
</body>
</html>
