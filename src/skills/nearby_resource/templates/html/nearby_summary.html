<!doctype html>
<html lang="zh-CN" data-template="nearby_summary" data-layout="summary">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>嘉路康养生活圈 · 语音摘要</title>
  <link rel="stylesheet" href="./_design_tokens.css" />
  <link rel="stylesheet" href="./_base.css" />
</head>
<body>
  <div class="nb-wrap">
    <section class="nb-card">
      <div class="nb-head">
        <div>
          <h2 class="nb-title">🔊 周边配套语音摘要</h2>
          <p class="nb-sub">{{centerName}} · {{radiusKm}} 公里康养生活圈</p>
        </div>
        <span class="nb-badge">无障碍</span>
      </div>
      <div class="nb-sum">
        <p>{{summaryText}}</p>
      </div>
      <div class="nb-stats">
        {{#statsLabels}}
        <div class="nb-stat">
          <div class="nb-stat-n" style="color:{{color}}">{{count}}</div>
          <div class="nb-stat-l">{{emoji}} {{label}}</div>
        </div>
        {{/statsLabels}}
      </div>
      <!-- 紧密追问区 -->
      {{{compact_followups}}}
    </section>
  </div>
  <script type="application/json">
  {
    "centerName": "嘉路康养中心", "radiusKm": 15,
    "summaryText": "嘉路康养中心 15 公里康养生活圈共收录 388 个配套：住 180 处（民宿、康养小院），吃 73 家（海鲜、私房菜），游 127 个滨海景区，娱 32 处垂钓休闲，购 13 处特产购物，行 8 处包车交通，养 3 处医疗康养。想看哪类，点下方按钮看地图或清单。",
    "statsLabels": [
      { "key": "stay", "label": "住", "emoji": "🏠", "count": 180, "color": "#3B82A0" },
      { "key": "food", "label": "吃", "emoji": "🍜", "count": 73, "color": "#F2994A" },
      { "key": "spot", "label": "游", "emoji": "🏖️", "count": 127, "color": "#2BAE8E" },
      { "key": "leisure", "label": "娱", "emoji": "🎣", "count": 32, "color": "#8E6FD8" },
      { "key": "shop", "label": "购", "emoji": "🛍️", "count": 13, "color": "#E08AC0" },
      { "key": "transit", "label": "行", "emoji": "🚐", "count": 8, "color": "#8A8278" },
      { "key": "wellness", "label": "养", "emoji": "🏥", "count": 3, "color": "#E5484D" }
    ]
  }
  </script>
</body>
</html>
