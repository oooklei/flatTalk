<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅居行程安排卡片模板</title>
<style>
  :root {
    --primary: #FF7826;
    --primary-gradient: linear-gradient(135deg, #FF7826 0%, #FF9A5C 100%);
    --bg: #F8EAD9; --bg-white: #ffffff;
    --ink: #3A3A3A; --ink-light: #666; --muted: #999999;
    --border: #E5E5E5; --divider: #F0EBE3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .chat-section-title {
    font-size: 16px; font-weight: 700; color: var(--ink);
    margin: 0 0 8px; padding: 8px 12px;
    background: linear-gradient(135deg, #FFF7E6, #FFF3E0);
    border-radius: 8px; border-left: 3px solid var(--primary);
  }
  .intro { font-size: 13px; color: var(--ink-light); line-height: 1.6; margin-bottom: 10px; }

  /* 天数点击切换 */
  .day-tabs {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px; padding: 2px 0;
  }
  .day-tab {
    appearance: none; border: 1px solid var(--border);
    background: var(--bg-white); color: var(--ink-light);
    border-radius: 12px; padding: 5px 12px;
    font-size: 12px; font-weight: 700; line-height: 1.2;
    cursor: pointer; font-family: inherit;
    transition: background .2s, color .2s, border-color .2s, box-shadow .2s;
  }
  .day-tab:active { transform: scale(0.97); }
  .day-tab.is-active {
    background: var(--primary-gradient); color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(255, 120, 38, 0.28);
  }

  .day-panels { position: relative; }
  .day-card {
    display: none;
    background: var(--bg-white); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    animation: dayFade .22s ease;
  }
  .day-card.is-active { display: block; }
  @keyframes dayFade {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .day-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .day-num {
    padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700;
    background: var(--primary-gradient); color: #fff; flex-shrink: 0;
  }
  .day-theme { font-size: 14px; font-weight: 700; }
  .slot { display: flex; gap: 8px; padding: 5px 0; font-size: 13px; line-height: 1.6; }
  .slot-label {
    flex-shrink: 0; width: 44px; font-size: 12px; font-weight: 600;
    color: var(--primary); padding-top: 1px;
  }
  .slot-text { flex: 1; color: var(--ink-light); }
  .slot-text b { color: var(--ink); }
  .day-tip {
    margin-top: 6px; padding: 6px 8px; border-radius: 8px;
    background: #E8F5E9; color: #2E7D32; font-size: 12px; line-height: 1.5;
  }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .wx-action { margin-top: 12px; text-align: right; }
  .wx-btn {
    appearance: none; border: none; cursor: pointer; font-family: inherit;
    background: var(--primary-gradient); color: #fff;
    border-radius: 22px; padding: 9px 18px; font-size: 13px; font-weight: 700;
    box-shadow: 0 3px 10px rgba(255, 120, 38, 0.3);
  }
  .wx-btn:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="chat-section-title">{{title|🗓️ 行程安排（慢节奏 · 每日一景）}}</div>
    <div class="intro">{{{intro|按「上午一景 + 下午休整」的慢节奏编排，避免长者疲劳。}}}</div>

    <div class="day-tabs" role="tablist">
    {{#days}}
      <button type="button" class="day-tab" role="tab" data-day="{{day|D1}}" aria-selected="false">{{day|D1}}</button>
    {{/days}}
    </div>

    <div class="day-panels">
    {{#days}}
    <div class="day-card" role="tabpanel" data-day="{{day|D1}}">
      <div class="day-head">
        <span class="day-num">{{day|D1}}</span>
        <span class="day-theme">{{theme|当日主题}}</span>
      </div>
      {{#slots}}
      <div class="slot">
        <span class="slot-label">{{time|上午}}</span>
        <span class="slot-text">{{{text|安排内容}}}</span>
      </div>
      {{/slots}}
      {{#tip}}<div class="day-tip">{{{.}}}</div>{{/tip}}
    </div>
    {{/days}}
    </div>

    <div class="note">{{note|行程可随身体状况灵活调整，基地管家每晚确认次日安排。}}</div>

    <div class="wx-action">
      <button type="button" id="btnWeatherRisk" class="wx-btn" data-city="{{destination|防城港}}">🌦️ 查看天气风险</button>
    </div>
  </div>

  <script>
  (function () {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.day-tab'));
    var panels = Array.prototype.slice.call(document.querySelectorAll('.day-card'));
    if (!tabs.length || !panels.length) return;

    function activate(day) {
      tabs.forEach(function (tab) {
        var on = tab.getAttribute('data-day') === day;
        tab.classList.toggle('is-active', on);
        tab.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      panels.forEach(function (panel) {
        panel.classList.toggle('is-active', panel.getAttribute('data-day') === day);
      });
    }

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        activate(tab.getAttribute('data-day'));
      });
    });

    activate(tabs[0].getAttribute('data-day'));
  })();
  </script>

  <script>
  // 天气风险按钮：把目的地城市回传父窗口，触发「查看天气风险」动作（腾讯天气接口）
  (function () {
    var btn = document.getElementById('btnWeatherRisk');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var city = (btn.getAttribute('data-city') || '').trim();
      try {
        window.parent.postMessage({
          type: 'gxy_card_action',
          action_key: 'travel_route.check_weather_risk',
          city: city,
        }, '*');
      } catch (e) { /* 忽略跨窗口通信异常 */ }
    });
  })();
  </script>
