<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>医养配套方案卡片模板</title>
<style>
  :root {
    --primary: #FF7826;
    --bg: #FFF8F0;
    --bg-white: #ffffff;
    --ink: #2C2C2C;
    --ink-light: #666;
    --muted: #999999;
    --border: #EDE4D8;
    --divider: #F0EBE3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .card {
    max-width: 640px; margin: 0 auto;
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .chat-section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 700; color: var(--ink);
    margin: 0 0 10px; padding: 10px 12px;
    background: #FFF7ED;
    border-radius: 10px;
    border-left: 3px solid var(--primary);
  }
  .chat-section-title .ico {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(145deg, #A78BFA, #7C5CFC);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
  }
  .intro {
    font-size: 13px; color: var(--ink); line-height: 1.6;
    margin: 0 0 4px; padding: 0 2px;
  }
  .group-list { margin-top: 4px; }
  .chat-medical-row {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 2px;
    border-bottom: 1px solid var(--divider);
  }
  .chat-medical-row:last-child { border-bottom: none; }
  .chat-medical-ico {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: #F7F4FF;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .chat-medical-body { flex: 1; min-width: 0; }
  .chat-medical-title {
    font-size: 14px; font-weight: 700; color: var(--ink);
    margin: 0 0 4px;
  }
  .chat-medical-items {
    font-size: 12px; line-height: 1.65; color: var(--ink-light);
  }
  .chat-medical-items b { color: var(--ink); }
  .foot {
    margin-top: 8px; padding-top: 4px;
  }
  .tip, .note {
    font-size: 12px; color: var(--muted); line-height: 1.65;
    margin: 8px 0 0;
  }
  .tip b, .note b { color: var(--ink-light); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="chat-section-title">
      <span class="ico">✚</span>
      <span>{{title|医养配套方案}}</span>
    </div>

    {{#intro}}
    <div class="intro">{{{.}}}</div>
    {{/intro}}

    <div class="group-list">
    {{#groups}}
      <div class="chat-medical-row">
        <div class="chat-medical-ico">{{icon|🩺}}</div>
        <div class="chat-medical-body">
          <div class="chat-medical-title">{{name|配套项目}}</div>
          <div class="chat-medical-items">
            {{#items}}<div>{{{text|说明}}}</div>{{/items}}
          </div>
        </div>
      </div>
    {{/groups}}
    </div>

    <div class="foot">
      <div class="tip">{{{tip|💡 常规酒店无驻场医护，建议选择近市区医院的康养基地。建议自备基础检测设备。}}}</div>
      {{#note}}
      <div class="note">{{{.}}}</div>
      {{/note}}
    </div>
  </div>

  <script type="application/json">
  {
    "title": "医养配套方案",
    "intro": "为您推荐的两套基地均具备基础康养配套：",
    "groups": [
      {
        "icon": "🏥",
        "name": "就近医疗",
        "items": [
          { "text": "首选基地距市第一人民医院仅 800m，步行可达" }
        ]
      },
      {
        "icon": "💊",
        "name": "便民购药",
        "items": [
          { "text": "基地楼下 200m 有仁爱大药房，常见药品齐全" }
        ]
      },
      {
        "icon": "🚗",
        "name": "出行协助",
        "items": [
          { "text": "基地管家可协助叫车、预约诊所" }
        ]
      }
    ],
    "tip": "💡 常规酒店无驻场医护，建议选择近市区医院的康养基地。建议自备基础检测设备。",
    "note": "⚠️ 以上仅为就医、购药、体征检测便民渠道建议，不构成专业医疗诊断。"
  }
  </script>
</body>
</html>
