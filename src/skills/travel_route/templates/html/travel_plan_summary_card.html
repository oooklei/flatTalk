<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅居方案总结卡片模板</title>
<style>
  :root {
    --primary: #FF7826;
    --bg: #FFF8F0; --bg-white: #ffffff;
    --ink: #2C2C2C; --ink-light: #666; --muted: #999999;
    --border: #F0E6DA; --divider: #E5EDE5; --price: #FF7826;
    --card-green: #EEF7EE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .card { max-width: 640px; margin: 0 auto; }

  .chat-section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 700; color: var(--ink);
    margin: 0 0 10px; padding: 10px 12px;
    background: #FFF7ED; border-radius: 10px;
    border-left: 3px solid var(--primary);
  }
  .chat-section-title .ico {
    width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0;
    border: 1.5px solid #4CAF50; color: #4CAF50;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; background: #F1FBF1;
  }

  .sum-box {
    background: var(--card-green);
    border: 1px solid #D9ECDD;
    border-radius: 14px;
    padding: 4px 14px 14px;
  }
  .sum-rows { font-size: 13px; }
  .sum-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--divider);
  }
  .sum-label { color: var(--muted); flex-shrink: 0; }
  .sum-value { text-align: right; color: var(--ink); font-weight: 700; line-height: 1.45; }

  .total {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0 4px; border-top: 1px solid var(--divider);
  }
  .total-label { font-size: 13px; color: var(--muted); }
  .total-price { font-size: 18px; font-weight: 800; color: var(--price); }
  .total-price small { font-size: 12px; color: var(--muted); font-weight: 400; }

  .more-box {
    margin-top: 12px;
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 12px 4px;
  }
  .more-title {
    font-size: 13px; color: var(--ink-light); font-weight: 600;
    margin: 0 0 4px; padding: 0 2px;
  }
  .more-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--divider);
  }
  .more-item:last-child { border-bottom: none; }
  .more-ico {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; background: #F5F5F5;
  }
  .more-ico.food { background: #FFE8EF; }
  .more-ico.pack { background: #E8F2FF; }
  .more-ico.act { background: #E8F8EE; }
  .more-body { flex: 1; min-width: 0; }
  .more-label {
    font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.4;
  }
  .more-desc {
    font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.45;
  }
  .more-arrow {
    flex-shrink: 0; color: #CCC; font-size: 16px; font-weight: 400;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="chat-section-title">
      <span class="ico">✓</span>
      <span>{{title|旅居方案总结}}</span>
    </div>

    <div class="sum-box">
      <div class="sum-rows">
        {{#rows}}
        <div class="sum-row">
          <span class="sum-label">{{label|项目}}</span>
          <span class="sum-value">{{value|—}}</span>
        </div>
        {{/rows}}
      </div>
      <div class="total">
        <span class="total-label">{{totalLabel|预估总费用}}</span>
        <span class="total-price">¥{{totalPrice|—}}<small>{{totalNote|}}</small></span>
      </div>
    </div>
    <!-- 紧密追问区 -->
    {{{compact_followups}}}
  </div>

  <script type="application/json">
{
  "title": "旅居方案总结",
  "rows": [
    {
      "label": "目的地",
      "value": "防城港 · 滨海康养"
    },
    {
      "label": "旅居天数",
      "value": "10天9晚"
    },
    {
      "label": "出行人数",
      "value": "2人（2位长者）"
    },
    {
      "label": "首选住宿",
      "value": "恒荣大酒店旅居康养基地"
    }
  ],
  "totalLabel": "预估总费用",
  "totalPrice": "3,960起",
  "totalNote": "",
  "compact_followups": ""
}
</script>
</body>
</html>
