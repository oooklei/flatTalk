<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>适老化景点推荐卡片模板</title>
<style>
  :root {
    --primary: #FF7826;
    --bg: #FFF8F0; --bg-white: #ffffff;
    --ink: #2C2C2C; --ink-light: #666; --muted: #999999;
    --border: #EDE4D8; --divider: #F0EBE3;
    --tag-free: #22A06B; --tag-fee: #3B82C4; --tag-trip: #5B9FED;
    --val: #2E7D32; --play: #E67E22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .chat-section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 700; color: var(--ink);
    margin: 0 0 8px; padding: 10px 12px;
    background: #FFF7ED;
    border-radius: 10px;
    border-left: 3px solid var(--primary);
  }
  .chat-section-title .ico {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(145deg, #7DD3FC, #38BDF8);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .intro {
    font-size: 13px; color: var(--ink-light); line-height: 1.65;
    margin: 0 0 12px; padding: 0 2px;
  }

  .chat-spot-card {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .spot-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
    margin-bottom: 8px;
  }
  .chat-spot-name {
    font-size: 15px; font-weight: 800; line-height: 1.35;
    margin-right: 2px;
  }
  .chat-spot-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .chat-spot-tag {
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; color: #fff; background: var(--tag-trip);
  }
  .chat-spot-tag.free,
  .chat-spot-tag.good { background: var(--tag-free); }
  .chat-spot-tag.fee { background: var(--tag-fee); }
  .chat-spot-tag.trip { background: var(--tag-trip); }

  .spot-row {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 12px; line-height: 1.6; margin-top: 5px;
  }
  .spot-row .ri { flex-shrink: 0; width: 14px; text-align: center; line-height: 1.6; }
  .spot-row .lab { flex-shrink: 0; font-weight: 700; }
  .spot-row.value .lab { color: var(--val); }
  .spot-row.play .lab { color: var(--play); }
  .spot-row .txt { color: var(--ink-light); flex: 1; min-width: 0; }
  .spot-row.meta {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--divider);
    color: var(--muted);
  }
  .spot-row.meta .txt { color: var(--muted); }

  .note {
    font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="chat-section-title">
      <span class="ico">🏞️</span>
      <span>{{title|适老化景点推荐}}</span>
    </div>
    {{#intro}}
    <div class="intro">{{{.}}}</div>
    {{/intro}}

    {{#spots}}
    <div class="chat-spot-card">
      <div class="spot-head">
        <div class="chat-spot-name">{{name|景点名称}}</div>
        <div class="chat-spot-tags">
          {{#tags}}<span class="chat-spot-tag {{cls|}}">{{label|标签}}</span>{{/tags}}
        </div>
      </div>
      {{#desc}}
      <div class="spot-row value">
        <span class="ri">🌿</span>
        <span class="lab">康养价值：</span>
        <span class="txt">{{{.}}}</span>
      </div>
      {{/desc}}
      {{#play}}
      <div class="spot-row play">
        <span class="ri">🧓</span>
        <span class="lab">长者玩法：</span>
        <span class="txt">{{{.}}}</span>
      </div>
      {{/play}}
      {{#meta}}
      <div class="spot-row meta">
        <span class="ri">🚗</span>
        <span class="txt">{{.}}</span>
      </div>
      {{/meta}}
    </div>
    {{/spots}}

    {{#note}}
    <div class="note">{{.}}</div>
    {{/note}}
  </div>

      }
    ]
  }
  </script>
</body>
</html>
