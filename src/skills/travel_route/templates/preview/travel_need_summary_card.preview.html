<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --primary: #FF7826;
    --primary-gradient: linear-gradient(135deg, #FF7826 0%, #FF9A5C 100%);
    --bg: #F8EAD9; --bg-white: #ffffff;
    --ink: #3A3A3A; --ink-light: #666; --muted: #999999;
    --border: #E5E5E5; --divider: #F0EBE3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .card {
    max-width: 640px; margin: 0 auto; background: var(--bg-white);
    border-radius: 14px; padding: 14px; border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .chat-section-title {
    font-size: 16px; font-weight: 700; color: var(--ink);
    margin: 0 0 8px; padding: 8px 12px;
    background: linear-gradient(135deg, #FFF7E6, #FFF3E0);
    border-radius: 8px; border-left: 3px solid var(--primary);
  }
  .chat-text { font-size: 15px; line-height: 1.7; }
  .chat-need-tags { margin: 8px 0; }
  .chat-need-cat { margin-bottom: 6px; }
  .chat-need-cat-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .chat-need-cat-items { display: flex; flex-wrap: wrap; gap: 4px; }
  .chat-need-tag {
    display: inline-block; padding: 3px 10px; font-size: 12px;
    background: #E8F5E9; color: #2E7D32; border-radius: 12px; font-weight: 500;
  }
  .conclusion { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .conclusion strong { color: var(--primary); }


.tc-deck{box-sizing:border-box;}
.tc-deck[data-layout="horizontal"]{display:flex;flex-direction:row;flex-wrap:nowrap;gap:16px;overflow-x:auto;padding:8px 0;}
.tc-deck[data-layout="vertical"]{display:flex;flex-direction:column;gap:16px;}
.tc-card{flex:0 0 auto;}
.tc-pager{margin-top:12px;font:13px/1.4 system-ui,sans-serif;color:#666;}
</style>
</head>
<body>
<div class="tc-deck" data-layout="vertical"><div class="tc-card">
  <div class="card">
    <div class="chat-section-title">为您匹配「医养照护型」康养方案</div>
    <div class="chat-text">检测到您的家人有<strong>用药管理/慢病监测需求</strong>，我们优先推荐距三甲医院800米内、配备药品存放柜和每日提醒服务的康养基地。以下方案已重点标注周边医疗资源与基地康养配套。</div>
    <div class="chat-need-tags">
      
      <div class="chat-need-cat">
        <div class="chat-need-cat-label">出行</div>
        <div class="chat-need-cat-items">
          <span class="chat-need-tag">防城港10天旅居</span><span class="chat-need-tag">3人出行</span>
        </div>
      </div>
      
      <div class="chat-need-cat">
        <div class="chat-need-cat-label">人群</div>
        <div class="chat-need-cat-items">
          <span class="chat-need-tag">2位长者</span><span class="chat-need-tag">1位儿童</span>
        </div>
      </div>
      
      <div class="chat-need-cat">
        <div class="chat-need-cat-label">医养</div>
        <div class="chat-need-cat-items">
          <span class="chat-need-tag">用药管理</span><span class="chat-need-tag">血压监测</span>
        </div>
      </div>
      
      <div class="chat-need-cat">
        <div class="chat-need-cat-label">食宿</div>
        <div class="chat-need-cat-items">
          <span class="chat-need-tag">三餐全包</span><span class="chat-need-tag">电梯房</span>
        </div>
      </div>
      
      <div class="chat-need-cat">
        <div class="chat-need-cat-label">行程</div>
        <div class="chat-need-cat-items">
          <span class="chat-need-tag">慢节奏</span><span class="chat-need-tag">少赶路</span><span class="chat-need-tag">平缓路线</span>
        </div>
      </div>
      
    </div>
    <div class="conclusion">💡 核心结论：优先推荐<strong>康养旅居基地</strong>，普通景区酒店无法满足三餐+医养配套+适老化设施的综合需求。</div>
  </div>

  
</div></div>

</body>
</html>
