<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --primary: #FF7826;
    --primary-gradient: linear-gradient(135deg, #FF7826 0%, #FF9A5C 100%);
    --bg: #F8EAD9; --bg-white: #ffffff;
    --ink: #3A3A3A; --ink-light: #666; --muted: #999999;
    --border: #E5E5E5;
    --warn: #C0392B; --warn-soft: #FDECEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .hd {
    font-size: 16px; font-weight: 700; margin: 0 0 10px; padding: 8px 12px;
    background: linear-gradient(135deg, #FFF7E6, #FFF3E0);
    border-radius: 8px; border-left: 3px solid var(--primary);
  }
  .cur {
    margin: 0 0 12px; padding: 16px; border-radius: 14px;
    background: var(--primary-gradient); color: #fff;
    display: flex; align-items: baseline; gap: 12px;
    box-shadow: 0 4px 12px rgba(255, 120, 38, 0.25);
  }
  .cur .t { font-size: 34px; font-weight: 800; line-height: 1; }
  .cur .w { font-size: 15px; opacity: .95; }
  .cur .sub { font-size: 12px; opacity: .9; margin-top: 6px; }
  .tbl {
    width: 100%; border-collapse: collapse; background: var(--bg-white);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; font-size: 12.5px;
  }
  .tbl th, .tbl td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
  .tbl th { background: #FFF3E0; color: var(--ink-light); font-weight: 700; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl .night { color: var(--muted); font-size: 11px; }
  .tips { margin-top: 12px; padding: 12px 14px; background: var(--warn-soft); border-radius: 12px; }
  .tips h4 { margin: 0 0 8px; color: var(--warn); font-size: 14px; }
  .tips ul { margin: 0; padding-left: 18px; }
  .tips li { margin: 6px 0; line-height: 1.55; color: #7a2e22; font-size: 13px; }
  .degraded {
    margin: 0 0 12px; padding: 12px 14px; background: var(--warn-soft);
    border-radius: 12px; color: var(--warn); font-size: 13px; line-height: 1.6;
  }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: right; }


.tc-deck{box-sizing:border-box;}
.tc-deck[data-layout="horizontal"]{display:flex;flex-direction:row;flex-wrap:nowrap;gap:16px;overflow-x:auto;padding:8px 0;}
.tc-deck[data-layout="vertical"]{display:flex;flex-direction:column;gap:16px;}
.tc-card{flex:0 0 auto;}
.tc-pager{margin-top:12px;font:13px/1.4 system-ui,sans-serif;color:#666;}
</style>
</head>
<body>
<div class="tc-deck" data-layout="vertical"><div class="tc-card">
  <div class="wrap">
    <div class="hd">🌦️ 目的地 · 旅居天气风险</div>

    

    

    <div class="tips">
      <h4>长者风险提示</h4>
      <ul>
      
      </ul>
    </div>

    
  </div>
</div></div>

</body>
</html>
